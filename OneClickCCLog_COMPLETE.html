                        msgs.push({ name: 'system', text, icon: '', exportIcon: '', color: '#ccc', channel: '메인', date: '' });
                        return;
                    }
                    if (!name) name = icon ? '이름 없음' : 'system';
                    if (text === '' && !icon) return; // 본문도 초상화도 없는 빈 행
                    // 플러그인 뷰어 출력에는 채널 표기가 없고 시각도 표시용 문자열뿐이라 date는 비운다.
                    msgs.push({ name, text, icon, exportIcon: icon, color: color || '#ccc', channel: '메인', date: '' });
                });
                return msgs;
            }

            // 레거시 구조
            const items = doc.querySelectorAll('[data-index]');
            items.forEach(x => {
                const h6 = x.querySelector('h6');
                let name = '', color = '';
                if (h6) {
                    for (const n of h6.childNodes) if (n.nodeType === 3) name += n.textContent;
                    name = name.trim();
                    color = h6.style.color || '';
                }
                const p = x.querySelector('p');
                const text = stripEdited(p ? p.textContent : '');
                const img = x.querySelector('.MuiListItemAvatar-root img') || x.querySelector('img');
                const icon = img ? (img.getAttribute('src') || '') : '';
                if (!name) name = icon ? '이름 없음' : 'system';
                if (text === '' && !icon && name.toLowerCase() !== 'system') return;
                msgs.push({ name, text, icon, exportIcon: icon, color: color || '#ccc', channel: '메인', date: '' });
            });
            return msgs;
        }

        function loadFromHTMLFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const msgs = parseViewerHTML(e.target.result);
                    if (!msgs.length) {
                        previewArea.innerHTML = '<p style="color:red;padding:20px;">메시지를 찾지 못했습니다. (확장 뷰어 형식의 HTML인지 확인하세요)</p>';
                        return;
                    }
                    window.allMessages = msgs;
                    window.selectedChannels = new Set(); // 단일 채널 → 전체 표시
                    renderChannelFilter();
                    createChannelColorSettings();
                    renderMessages(); // renderMessages가 시스템/서술자/패딩/배경/편집까지 전부 처리
                } catch (err) {
                    console.error(err);
                    previewArea.innerHTML = `<p style="color:red;padding:20px;">파싱 오류: ${err.message}</p>`;
                }
            };
            reader.onerror = () => { previewArea.innerHTML = '<p style="color:red;padding:20px;">파일 읽기 실패</p>'; };
            reader.readAsText(file, 'UTF-8');
        }

        // 독립 실행형 입력: 이전 로그 HTML은 포트레이트 원본으로만 사용하고,
        // 실제 메시지/탭은 코코포리아 전체 내보내기 HTML에서 읽는다.
        let pluginPortraits = new Map();
        let pluginJournalColors = new Map();
        let pluginMainMessages = [];
        let whisperPortraits = {};
        let channelColors = {};

        const readLocalHTML = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = () => reject(new Error('파일 읽기 실패'));
            reader.readAsText(file, 'UTF-8');
        });

        function getPluginPortraits(messages) {
            const map = new Map();
            pluginMainMessages = messages;
            pluginMainMessages.forEach(m => {
                if (!m.name || m.name.toLowerCase() === 'system') return;
                if (m.color && !pluginJournalColors.has(m.name)) pluginJournalColors.set(m.name, m.color);
                if (!m.icon) return;
                if (!map.has(m.name)) map.set(m.name, []);
                if (!map.get(m.name).includes(m.icon)) map.get(m.name).push(m.icon);
            });
            return map;
        }

        function getChannelColor(channel) {
            return channelColors[channel] || '#1f1e22';
        }

        function mixHex(hex, overlay, ratio) {
            const values = [hex, overlay].map(value => value.match(/[\da-f]{2}/gi)?.map(part => parseInt(part, 16)) || [0, 0, 0]);
            return '#' + values[0].map((value, i) => Math.round(value * (1 - ratio) + values[1][i] * ratio).toString(16).padStart(2, '0')).join('');
        }

        function getMainChannelColor() {
            const main = [...Object.keys(channelColors)].find(channel => isMainTab(channel));
            return main ? getChannelColor(main) : '#1f1e22';
        }

        function sourceChannel(node) {
            const explicit = node.getAttribute('data-channel') || node.getAttribute('data-tab') || node.getAttribute('data-room-tab');
            if (explicit) return explicit;
            const owner = node.closest('[data-channel-name],[data-tab-name],.channel,.tab,.log-channel');
            if (owner) return owner.getAttribute('data-channel-name') || owner.getAttribute('data-tab-name') || owner.dataset.channel || owner.dataset.tab || owner.textContent.trim();
            let heading = node.previousElementSibling;
            while (heading) {
                if (/^H[1-6]$/.test(heading.tagName)) return heading.textContent.trim();
                heading = heading.previousElementSibling;
            }
            return '메인';
        }

        // 코코포리아 자체 HTML 내보내기(신규) 형식
        //   <article class="message" data-channel="main|info|other|탭ID">
        //     <span class="avatar avatar-image-0"> 또는 <span class="avatar-spacer">
        //     <div class="message-content">
        //       <div class="message-header">
        //         <span class="speaker" style="--speaker-color:#888">이름</span>
        //         <time class="timestamp" datetime="ISO">…</time>
        //         <span class="edited">…</span>            (편집된 메시지)
        //         <span class="channel-name">[메인]</span>  ([すべて] 내보내기에만 존재)
        //       </div>
        //       <div class="message-text">본문</div>
        //       <span class="roll-result success">판정 결과</span>
        //     </div>
        //   </article>
        // 초상화는 <style> 안에 .avatar-image-N { background-image: url("data:…") } 로 내장된다.
        function collectAvatarImages(doc) {
            const map = new Map();
            doc.querySelectorAll('style').forEach(style => {
                const re = /\.avatar-image-(\d+)\s*\{[^}]*?background-image\s*:\s*url\(\s*(['"]?)([^'")]+)\2\s*\)/g;
                let m;
                while ((m = re.exec(style.textContent))) map.set(m[1], m[3]);
            });
            return map;
        }

        // message-text는 white-space:pre-wrap이라 개행이 리터럴로 들어있다. br도 함께 살린다.
        const blockText = node => {
            if (!node) return '';
            const copy = node.cloneNode(true);
            copy.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
            return copy.textContent.replace(/\r\n?/g, '\n').trim();
        };

        function parseCcfoliaExport(doc) {
            const articles = [...doc.querySelectorAll('article.message')];
            if (!articles.length) return [];
            const avatars = collectAvatarImages(doc);
            // 탭별 내보내기에는 .channel-name이 없다 → <h1 class="log-title">방이름 [탭]</h1>에서 회수
            const titleTab = ((doc.querySelector('.log-title')?.textContent || '').match(/\[([^\]]*)\]\s*$/) || [])[1]?.trim() || '';
            const messages = [];
            articles.forEach(article => {
                const label = blockText(article.querySelector('.channel-name')).replace(/^\[|\]$/g, '').trim();
                const channel = label || titleTab || article.getAttribute('data-channel') || '메인';
                const speaker = article.querySelector('.speaker');
                const body = blockText(article.querySelector('.message-text'));
                const roll = [...article.querySelectorAll('.roll-result')].map(blockText).filter(Boolean).join('\n');
                let text = stripEdited([body, roll].filter(Boolean).join('\n'));

                if (article.classList.contains('system') || !speaker) {
                    if (!text) { // 시스템 메시지는 .message-text 없이 본문만 있을 수 있다
                        const copy = article.cloneNode(true);
                        copy.querySelectorAll('.message-header, .timestamp, .channel-name, .edited').forEach(n => n.remove());
                        text = stripEdited(blockText(copy));
                    }
                    if (!text) return;
                    messages.push({ name: 'system', text, icon: '', exportIcon: '', color: '#ccc', channel });
                    return;
                }

                const avatarClass = [...(article.querySelector('.avatar')?.classList || [])].find(c => /^avatar-image-\d+$/.test(c));
                const icon = avatarClass ? (avatars.get(avatarClass.replace('avatar-image-', '')) || '') : '';
                if (!text && !icon) return; // 본문도 초상화도 없는 빈 행
                const name = blockText(speaker) || (icon ? '이름 없음' : 'system');
                const color = (speaker.style.getPropertyValue('--speaker-color') || '').trim() || '#ccc';
                const date = article.querySelector('.timestamp')?.getAttribute('datetime') || '';
                messages.push({ name, text, icon, exportIcon: icon, color, channel, date });
            });
            return messages;
        }

        function parseWholeExport(html) {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            // 코코포리아 자체 HTML 내보내기(신규)를 우선 시도
            const native = parseCcfoliaExport(doc);
            if (native.length) return native;
            // 구 전체 내보내기 형식:
            // <p style="color:..."><span>[탭]</span><span>이름</span><span>내용<br>...</span></p>
            const exportedRows = [...doc.querySelectorAll('p')].map(p => {
                const spans = [...p.children].filter(x => x.tagName === 'SPAN');
                if (spans.length < 3) return null;
                const textOf = node => { const copy = node.cloneNode(true); copy.querySelectorAll('br').forEach(br => br.replaceWith('\n')); return copy.textContent.trim(); };
                const channel = textOf(spans[0]).replace(/^\[|\]$/g, '').trim() || '메인';
                const name = textOf(spans[1]) || 'system';
                const text = stripEdited(textOf(spans[2]));
                if (!text && name.toLowerCase() !== 'system') return null;
                return { name, text, icon: '', color: p.style.color || '#ccc', channel };
            }).filter(Boolean);
            if (exportedRows.length) return exportedRows;

            // 이 도구의 내보내기는 초상화를 <img>가 아니라 .avatar-image-N 클래스로,
            // 이름 색도 인라인이 아니라 .sN 클래스로 들고 있다.
            const avatars = collectAvatarImages(doc);
            const classColors = new Map();
            doc.querySelectorAll('style').forEach(style => {
                const re = /\.(s\d+)[^{}]*\{([^}]*)\}/g;
                let m;
                while ((m = re.exec(style.textContent))) {
                    const color = /(?:^|[;{\s])color:\s*([^;!}]+)/.exec(m[2]);
                    if (color) classColors.set(m[1], color[1].trim());
                }
            });
            const classColor = node => [...(node?.classList || [])].map(c => classColors.get(c)).find(Boolean) || '';

            // 본문에 삽입된 이미지: 규칙에서 원본을 되찾아 이 세션의 id로 다시 등록한다.
            const insimgSrc = new Map();
            doc.querySelectorAll('style').forEach(style => {
                const re = /\.insimg-(\d+)\{([^}]*)\}/g;
                let m;
                while ((m = re.exec(style.textContent))) {
                    const url = /background-image:\s*url\(\s*(['"]?)([^'")]+)\1\s*\)/.exec(m[2]);
                    const size = /width:\s*(\d+)px[^}]*aspect-ratio:\s*(\d+)\s*\/\s*(\d+)/.exec(m[2]);
                    if (url) insimgSrc.set(m[1], { src: url[2], w: +(size?.[2] || 400), h: +(size?.[3] || 300) });
                }
            });
            // 남이 준 파일이므로 통째로 innerHTML에 넣지 않는다. 우리 삽입 이미지와 <br>만 남긴다.
            const bodyHtml = node => {
                if (!node?.querySelector?.('[class*="insimg-"]')) return '';
                const box = node.cloneNode(true);
                box.querySelectorAll('[class*="insimg-"]').forEach(el => {
                    const old = [...el.classList].find(c => /^insimg-\d+$/.test(c))?.slice(7);
                    const info = insimgSrc.get(old);
                    el.replaceWith(info ? makeInsertedNode(registerInsertedImage(info)) : document.createTextNode(''));
                });
                return sanitizeBodyHtml(box.innerHTML);
            };
            const classIcon = x => {
                const cls = [...(x.querySelector('.msg_container')?.classList || [])].find(c => /^avatar-image-\d+$/.test(c));
                return cls ? (avatars.get(cls.slice(13)) || '') : '';
            };

            const nodes = [...doc.querySelectorAll('.m,[data-index],.gap,article,li,tr')]
                .filter(n => !n.parentElement?.closest('.m,[data-index],.gap,article,li,tr'));
            const messages = [];
            nodes.forEach(x => {
                const compact = x.matches('.m') || x.querySelector('.nm,.tx');
                const nameNode = x.querySelector('.nm,[class*="name"],[class*="user"],h6');
                const textNode = x.querySelector('.tx,[class*="message"],[class*="text"]') || x.querySelector('p');
                let name = nameNode ? nameNode.textContent.trim() : '';
                let text = textNode ? textNode.textContent.trim() : x.textContent.trim();
                const html = bodyHtml(textNode);
                // 이미지만 있는 줄은 글자가 없어도 버리면 안 된다.
                const imageOnly = x.classList?.contains('image-row');
                if (!compact && !name && !text && !html) return;
                const dt = nameNode?.querySelector('.dt');
                if (dt) { name = name.replace(dt.textContent, '').trim(); }
                if (!name && !imageOnly) name = 'system';
                text = stripEdited(text);
                if (!text && !html && name.toLowerCase() !== 'system') return;
                const icon = x.querySelector('img')?.getAttribute('src') || classIcon(x);
                const channel = sourceChannel(x);
                messages.push({ name, text, icon, exportIcon: icon, color: nameNode?.style.color || classColor(nameNode) || '#ccc', channel, ...(html ? { html } : {}), ...(imageOnly ? { imageOnly: true } : {}) });
            });
            return messages;
        }

        // 초상화 우선순위
        //   1) 그 메시지에 실제로 박혀 있던 초상화 (m.exportIcon)
        //   2) 사용자가 직접 지정한 것 (저널 이미지/링크, 탭 공통 URL)
        //   3) 이름으로 찾은 대체 초상화
        // 신규 내보내기와 플러그인 로그는 메시지마다 초상화를 들고 있으므로 1)에서 끝난다.
        // 2)·3)은 초상화가 없는 구 내보내기를 메울 때만 쓰인다.
        // (저널 핀을 걸면 로그 중간의 초상화 교체가 한 장으로 납작해지므로, 내장 초상화가
        //  있는 탭은 openJournalImageModal에서 핀 자체를 잠근다)
        function applyImportedPortraits() {
            const hasPlugin = pluginMainMessages.length > 0;
            const mainUseCount = new Map();
            window.allMessages.forEach(m => {
                const setting = tabSettings.get(m.channel);
                const journalKey = `${m.channel}|${m.name}`;
                if (pluginJournalColors.has(m.name)) m.color = pluginJournalColors.get(m.name);
                if (isMainTab(m.channel)) {
                    // 이름별 등장 순서로 플러그인 로그와 짝을 맞추므로, 건너뛰더라도 카운터는 항상 올린다.
                    const index = mainUseCount.get(m.name) || 0;
                    mainUseCount.set(m.name, index + 1);
                    if (m.exportIcon) { m.icon = m.exportIcon; return; }
                    if (!hasPlugin) { m.icon = ''; return; }
                    const source = pluginMainMessages.filter(x => x.name === m.name)[index];
                    if (source) {
                        m.icon = source.icon || '';
                        m.color = source.color || m.color;
                    } else {
                        m.icon = '';
                    }
                } else if (setting && !setting.portrait) {
                    m.icon = '';
                } else {
                    m.icon = m.exportIcon || journalImages[journalKey] || journalLinks[journalKey] || setting?.customUrl || whisperPortraits[m.channel] || (pluginPortraits.get(m.name) || []).at(-1) || '';
                }
            });
        }

        // 내보내기 HTML이 초상화를 품고 있으면, 저널 이미지 후보 목록을 그로부터 만든다.
        function collectPortraitCandidates(messages) {
            const map = new Map();
            messages.forEach(m => {
                const icon = m.exportIcon || m.icon;
                if (!icon || !m.name || m.name.toLowerCase() === 'system') return;
                if (!map.has(m.name)) map.set(m.name, []);
                if (!map.get(m.name).includes(icon)) map.get(m.name).push(icon);
            });
            return map;
        }

        // ─── 로그 파일 자동 판별 + 드롭존 ──────────────────────────
        const logFileInput = document.getElementById('logFileInput');
        const logDropzone = document.getElementById('logDropzone');
        const logFileChips = document.getElementById('logFileChips');
        let loadedLogFiles = []; // { name, kind, html, messages }

        // 코코포리아 내보내기(신·구)인지, 이전 로그 플러그인 뷰어 출력인지 자동 판별
        function detectLogKind(doc) {
            if (doc.querySelector('article.message, main.message-list')) return 'export';           // 신규 네이티브 내보내기
            if (doc.querySelector('.ccfolia_wrap .gap, .ccfolia_wrap .player.system')) return 'export'; // 이 도구가 내보낸 파일
            if (doc.querySelector('.m .nm, .m .tx, .message-container .m, [data-index] h6')) return 'plugin';
            const legacyRow = [...doc.querySelectorAll('p')]
                .some(p => [...p.children].filter(x => x.tagName === 'SPAN').length >= 3);          // 구 전체 내보내기
            if (legacyRow) return 'export';
            if (doc.querySelector('[data-index], .m')) return 'plugin';
            return 'unknown';
        }

        const KIND_LABEL = { export: '내보내기', plugin: '플러그인', unknown: '알 수 없음' };

        function renderLogFileChips() {
            logFileChips.innerHTML = '';
            loadedLogFiles.forEach((entry, i) => {
                const chip = document.createElement('div');
                chip.className = 'file-chip';

                const kind = document.createElement('span');
                kind.className = 'kind ' + entry.kind;
                kind.textContent = KIND_LABEL[entry.kind];

                const name = document.createElement('span');
                name.className = 'fname';
                name.textContent = entry.name;
                name.title = entry.name;

                const count = document.createElement('span');
                count.className = 'count';
                count.textContent = entry.kind === 'unknown' ? '인식 실패' : `${entry.messages.length}개`;

                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'remove';
                remove.textContent = '×';
                remove.title = '제거';
                remove.onclick = () => { loadedLogFiles.splice(i, 1); rebuildFromLoadedFiles(); };

                chip.append(kind, name, count, remove);
                logFileChips.appendChild(chip);
            });
        }

        // 탭별로 쪼개 내보낸 파일을 한 번에 넣어도 되도록 병합한다.
        // 같은 메시지가 [すべて]와 탭별 파일 양쪽에 있어도 중복되지 않는다.
        function mergeLogMessages(exportEntries, pluginEntries) {
            const seen = new Set();
            const merged = [];
            // 한 파일 안에서 반복된 대사는 그대로 살리고, 파일끼리 겹치는 것만 걸러야 한다.
            // 그래서 그 파일 안에서 몇 번째로 나온 동일 메시지인지를 키에 함께 넣는다.
            let localCount = new Map();
            const add = m => {
                const base = [m.channel, m.name, m.date || '', m.text].join('\u241F');
                const nth = (localCount.get(base) || 0) + 1;
                localCount.set(base, nth);
                const key = base + '\u241F#' + nth;
                if (seen.has(key)) return;
                seen.add(key);
                merged.push(m);
            };
            exportEntries.forEach(entry => { localCount = new Map(); entry.messages.forEach(add); });

            // 같은 방의 내보내기와 플러그인 로그를 함께 넣으면 같은 대사가 두 번 실린다.
            // 플러그인 쪽에는 채널·시각 표기가 없어 위 키로는 안 걸리므로, 이름+본문이
            // 내보내기에 있는 횟수만큼만 건너뛴다(같은 대사를 실제로 반복한 경우는 살린다).
            const quota = new Map();
            merged.forEach(m => {
                const key = m.name + '\u241F' + m.text;
                quota.set(key, (quota.get(key) || 0) + 1);
            });
            pluginEntries.forEach(entry => {
                localCount = new Map();
                entry.messages.forEach(m => {
                    const key = m.name + '\u241F' + m.text;
                    const left = quota.get(key) || 0;
                    if (left > 0) { quota.set(key, left - 1); return; }
                    add(m);
                });
            });

            // 신규 내보내기만 있을 때는 전 메시지에 타임스탬프가 있으므로 시간순으로 다시 엮는다.
            // (플러그인 로그가 섞이면 시각이 없어 정렬하지 않고 넣은 순서를 지킨다)
            if (exportEntries.length > 1 && merged.length && merged.every(m => m.date)) {
                merged.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
            }
            return merged;
        }

        function rebuildFromLoadedFiles() {
            renderLogFileChips();
            const exportFiles = loadedLogFiles.filter(f => f.kind === 'export');
            const pluginFiles = loadedLogFiles.filter(f => f.kind === 'plugin');
            if (!exportFiles.length && !pluginFiles.length) {
                window.allMessages = [];
                previewArea.innerHTML = loadedLogFiles.length
                    ? '<p style="color:#fbb034;padding:20px;">로그를 읽을 수 있는 HTML이 없습니다.</p>'
                    : '';
                return;
            }
            pluginJournalColors = new Map();
            pluginMainMessages = [];
            // 플러그인 로그는 그 자체가 메시지 소스이면서 초상화 변경 이력이기도 하다.
            pluginPortraits = pluginFiles.length ? getPluginPortraits(pluginFiles[0].messages) : new Map();
            window.allMessages = mergeLogMessages(exportFiles, pluginFiles);
            if (!pluginFiles.length) pluginPortraits = collectPortraitCandidates(window.allMessages);
            window.selectedChannels = new Set(); whisperPortraits = {};
            // 저널별로 찍어둔 초상화는 그 로그에만 해당한다. 파일을 새로 넣으면 비워야
            // 이전 로그의 핀이 새 로그의 메시지별 초상화를 덮어쓰지 않는다.
            journalImages = {}; journalLinks = {};
            initTabSettings(); renderChannelFilter(); createChannelColorSettings();
            if (bubbleThemeEnabled) applyBubbleDefaultColors();
            applyImportedPortraits();
            renderMessages();
        }

        async function addLogFiles(fileList) {
            const files = [...(fileList || [])].filter(f => /\.html?$/i.test(f.name));
            if (!files.length) return;
            const progress = document.getElementById('progressOverlay');
            const progressText = document.getElementById('progressText');
            progress.classList.add('show'); progressText.textContent = 'HTML 분석 중...';
            try {
                for (const file of files) {
                    const html = await readLocalHTML(file);
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    let kind = detectLogKind(doc);
                    const messages = kind === 'export' ? parseWholeExport(html)
                        : kind === 'plugin' ? parseViewerHTML(html) : [];
                    if (kind !== 'unknown' && !messages.length) kind = 'unknown';
                    const entry = { name: file.name, kind, html, messages };
                    const at = loadedLogFiles.findIndex(x => x.name === entry.name);
                    if (at >= 0) loadedLogFiles[at] = entry; else loadedLogFiles.push(entry);
                }
                progressText.textContent = '로그 화면 생성 중...';
                await new Promise(r => { requestAnimationFrame(r); setTimeout(r, 80); });
                rebuildFromLoadedFiles();
            } catch (err) {
                console.error(err);
                previewArea.innerHTML = `<p style="color:red;padding:20px;">파싱 오류: ${err.message}</p>`;
            } finally {
                progress.classList.remove('show');
            }
        }

        logDropzone.addEventListener('click', () => logFileInput.click());
        logDropzone.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); logFileInput.click(); }
        });
        logFileInput.addEventListener('change', () => { addLogFiles(logFileInput.files); logFileInput.value = ''; });

        const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
        ['dragenter', 'dragover'].forEach(type => document.addEventListener(type, e => {
            if (!hasFiles(e)) return;
            e.preventDefault();
            logDropzone.classList.add('dragover');
        }));
        document.addEventListener('dragleave', e => { if (!e.relatedTarget) logDropzone.classList.remove('dragover'); });
        document.addEventListener('drop', e => {
            if (!hasFiles(e)) return;
            e.preventDefault();
            logDropzone.classList.remove('dragover');
            addLogFiles(e.dataTransfer.files);
        });

        // ─── 본문 삽입 이미지 ──────────────────────────────────────────────
        // 원본은 여기 한 번만 두고, 본문에는 <span class="insimg insimg-N">만 남긴다.
        // 다시 그려도 id가 살아 있어야 하므로 렌더 함수 바깥(모듈 스코프)에 둔다.
        // localStorage에는 넣지 않는다 (5MB 한도라 이미지 한두 장에 바로 터진다).
        const insertedImages = new Map();   // id -> {src, w, h}
        const insertedImageIds = new Map(); // src -> id
        function registerInsertedImage(info) {
            if (insertedImageIds.has(info.src)) return insertedImageIds.get(info.src);
            const id = insertedImages.size;
            insertedImages.set(id, info);
            insertedImageIds.set(info.src, id);
            return id;
        }

        function makeInsertedNode(id) {
            const span = document.createElement('span');
            span.className = `insimg insimg-${id}`;
            span.setAttribute('contenteditable', 'false'); // 캐럿이 안쪽으로 들어가지 않게
            return span;
        }

        const insertMaxWidth = () => parseInt(document.getElementById('imageMaxWidth')?.value) || 800;

        // 이미지 소스(비트맵)를 설정한 최대 폭으로 줄이고 WebP로 다시 인코딩한다.
        function shrinkToWebp(source, naturalWidth, naturalHeight) {
            const scale = Math.min(1, insertMaxWidth() / naturalWidth);
            const w = Math.max(1, Math.round(naturalWidth * scale));
            const h = Math.max(1, Math.round(naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(source, 0, 0, w, h);
            // webp를 못 만드는 브라우저는 png를 돌려준다. 그대로 써도 동작은 같다.
            return { src: canvas.toDataURL('image/webp', 0.8), w, h };
        }

        async function shrinkPastedImage(file) {
            const bitmap = await createImageBitmap(file);
            try { return shrinkToWebp(bitmap, bitmap.width, bitmap.height); }
            finally { bitmap.close(); }
        }

        // 웹에서 복사한 이미지는 파일이 아니라 <img src="http…"> 로만 들어온다.
        // 받아서 똑같이 줄이되, CORS로 캔버스가 오염되면 링크를 그대로 쓴다(용량 0).
        async function shrinkRemoteImage(url) {
            const load = crossOrigin => new Promise(resolve => {
                const img = new Image();
                if (crossOrigin) img.crossOrigin = 'anonymous';
                img.referrerPolicy = 'no-referrer';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
            const safe = await load(true);
            if (safe) {
                try { return shrinkToWebp(safe, safe.naturalWidth, safe.naturalHeight); } catch (e) { /* 캔버스 오염 */ }
            }
            const plain = safe || await load(false);
            if (!plain) return null;
            const scale = Math.min(1, insertMaxWidth() / plain.naturalWidth);
            return { src: url, w: Math.round(plain.naturalWidth * scale), h: Math.round(plain.naturalHeight * scale) };
        }

        // await 전에 동기로 판단해야 하므로 꺼내기와 분리한다.
        function clipboardHasImage(data) {
            if ([...(data.files || [])].some(f => f.type.startsWith('image/'))) return true;
            if ([...(data.items || [])].some(i => i.kind === 'file' && i.type.startsWith('image/'))) return true;
            if (/<img\b[^>]*\bsrc\s*=/i.test(data.getData('text/html') || '')) return true;
            return /^(https?:\/\/\S+\.(png|jpe?g|gif|webp|avif|bmp)(\?\S*)?|data:image\/\S+)$/i.test((data.getData('text/plain') || '').trim());
        }

        // 클립보드에서 이미지를 꺼낸다. 파일 → items → text/html의 <img src> → 이미지 URL 순.
        async function imageFromClipboard(data) {
            const file = [...(data?.files || [])].find(f => f.type.startsWith('image/'))
                || [...(data?.items || [])].find(i => i.kind === 'file' && i.type.startsWith('image/'))?.getAsFile();
            if (file) return shrinkPastedImage(file);
            const html = data?.getData('text/html') || '';
            const plain = (data?.getData('text/plain') || '').trim();
            const url = /<img\b[^>]*\bsrc\s*=\s*["']([^"']+)["']/i.exec(html)?.[1]
                || (/^(https?:|data:image\/)\S+$/i.test(plain) ? plain : '');
            return url ? shrinkRemoteImage(url) : null;
        }

        // 편집한 본문은 우리가 만든 삽입 이미지와 줄바꿈만 남기고 전부 벗겨 낸다.
        // 재불러오기는 남이 준 HTML을 그대로 삼키는 경로라, 여기를 거치지 않은 마크업은
        // 절대 innerHTML로 넣지 않는다.
        function sanitizeBodyHtml(html) {
            // 살아 있는 div에 innerHTML로 붓으면 <img src=x onerror=…>가 그 자리에서 실행된다.
            // DOMParser 문서는 브라우징 컨텍스트가 없어 리소스를 받지도, 핸들러를 돌리지도 않는다.
            const box = new DOMParser().parseFromString('<body>' + html, 'text/html').body;
            [...box.querySelectorAll('*')].forEach(el => {
                if (el.tagName === 'BR') return;
                const cls = [...el.classList].find(c => /^insimg-\d+$/.test(c));
                if (cls) el.replaceWith(makeInsertedNode(Number(cls.slice(7))));
                else if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE') el.remove(); // 내용까지 버린다
                else el.replaceWith(...el.childNodes); // 태그는 버리고 내용만 살린다
            });
            return box.innerHTML;
        }

        // url() 안에서 문자열을 깨뜨리거나 </style>로 빠져나갈 수 있는 글자를 막는다.
        const cssUrl = u => u.replace(/["\\<\n\r]/g, c => '%' + c.charCodeAt(0).toString(16));

        // 삽입 이미지는 줄 가운데에 놓는다 (margin auto).
        // 이미지를 품은 본문은 줄 전체 폭을 쓰게 해야 margin auto가 실제로 가운데로 민다.
        const INSERTED_BASE_RULE = [
            '.ccfolia_wrap .insimg{display:block;max-width:100%;background-size:contain;background-repeat:no-repeat;background-position:center top;margin:6px auto}',
            '.ccfolia_wrap p:has(.insimg),.ccfolia_wrap .tx:has(.insimg){display:block;width:100%}'
        ].join('\n');

        // 붙여넣기 직후에는 다시 렌더하지 않으므로, 살아 있는 <style>에 규칙을 바로 꽂는다.
        function ensureInsertedRule(id) {
            const style = previewArea.querySelector('.ccfolia_wrap style');
            const info = insertedImages.get(id);
            if (!style || !info || style.textContent.includes(`.insimg-${id}{`)) return;
            const base = style.textContent.includes('.ccfolia_wrap .insimg{') ? '' : INSERTED_BASE_RULE + '\n';
            style.textContent += '\n' + base + `.ccfolia_wrap .insimg-${id}{width:${info.w}px;aspect-ratio:${info.w}/${info.h};background-image:url("${cssUrl(info.src)}")}`;
        }

        // 이름도 본문과 같이 메시지 객체에 되돌려 쓴다 (안 그러면 새로 끼운 줄의 이름이 날아간다).
        function attachNameEdit(spanName, m) {
            spanName.addEventListener('blur', () => { m.name = spanName.innerText.trim(); });
        }

        // 본문 편집 중 이미지 붙여넣기. 편집 결과는 메시지 객체에 되돌려 써야
        // 다시 그릴 때(regeneratePreview) 살아남는다.
        function attachImagePaste(spanText, m) {
            const save = () => {
                if (spanText.querySelector('.insimg')) {
                    m.html = sanitizeBodyHtml(spanText.innerHTML);
                    m.text = spanText.innerText.replace(/\r\n?/g, '\n');
                } else {
                    m.text = spanText.innerText.replace(/\r\n?/g, '\n');
                    delete m.html;
                }
            };
            spanText.addEventListener('blur', save);
            spanText.addEventListener('paste', async e => {
                const data = e.clipboardData;
                if (!data || !clipboardHasImage(data)) return;
                // clipboardData는 핸들러가 끝나면 못 읽고, preventDefault도 await 전에 해야 한다.
                e.preventDefault();
                const plain = (data.getData('text/plain') || '').trim();
                const range = document.getSelection()?.rangeCount ? document.getSelection().getRangeAt(0).cloneRange() : null;
                const info = await imageFromClipboard(data);
                const node = info ? makeInsertedNode(registerInsertedImage(info))
                    : document.createTextNode(plain); // 이미지를 못 가져오면 주소라도 남긴다
                if (range && spanText.contains(range.commonAncestorContainer)) {
                    range.deleteContents();
                    range.insertNode(node);
                } else {
                    spanText.appendChild(node);
                }
                if (info) ensureInsertedRule(Number(node.className.match(/insimg-(\d+)/)[1]));
                save();
            });
        }

        // ─── 미리보기 가상화 ───────────────────────────────────────────────
        // 15000줄을 전부 레이아웃에 올려 두면 글자 하나 칠 때마다 문서 전체가 다시 흐른다(실측 40ms).
        // 200줄씩 묶어 두고 화면 밖 묶음은 "접는다": 잰 높이를 인라인으로 고정해 자리는 남기고,
        // 내용물만 display:none으로 내려 레이아웃에서 뺀다. (content-visibility·contain은 효과 없었다)
        const VCHUNK_SIZE = 200;

        function updateChunkVisibility() {
            const wrap = previewArea.querySelector('.ccfolia_wrap');
            if (!wrap) return;
            const view = previewArea.clientHeight;
            const from = previewArea.scrollTop - view;
            const to = previewArea.scrollTop + view * 2;
            // 재배치하면서 재는 걸 피하려고 측정과 변경을 나눈다.
            const boxes = [...wrap.querySelectorAll('.vchunk')].map(c => [c, c.offsetTop, c.offsetHeight]);
            for (const [chunk, top, height] of boxes) {
                const visible = top + height >= from && top <= to;
                const folded = chunk.classList.contains('off');
                if (!visible && !folded) {
                    chunk.style.height = height + 'px';
                    chunk.classList.add('off');
                } else if (visible && folded) {
                    chunk.classList.remove('off');
                    chunk.style.height = '';
                }
            }
        }

        let chunkTick = 0;
        function scheduleChunkUpdate() {
            if (chunkTick) return;
            chunkTick = requestAnimationFrame(() => { chunkTick = 0; updateChunkVisibility(); });
        }

        // 접힌 높이는 그때의 폭 기준이라, 창 크기가 바뀌면 전부 펴고 다시 잰다.
        function unfoldChunks(root) {
            root.querySelectorAll('.vchunk').forEach(c => { c.classList.remove('off'); c.style.height = ''; });
        }

        previewArea.addEventListener('scroll', scheduleChunkUpdate);
        window.addEventListener('resize', () => { unfoldChunks(previewArea); scheduleChunkUpdate(); });

        // ─── 빈 줄 삽입 ────────────────────────────────────────────────────
        // 15000줄을 통째로 다시 그리면 몇 초씩 걸리므로, 렌더할 때 채널별로 껍데기
        // 한 벌만 떠 두고 삽입할 때는 그걸 복제한다.
        const blankRowTemplates = new Map();

        function blankRowTemplate(gap) {
            const node = gap.cloneNode(true);
            node.querySelectorAll('[class*="avatar-image-"]').forEach(el => {
                [...el.classList].filter(c => /^avatar-image-\d+$/.test(c)).forEach(c => el.classList.remove(c));
                el.removeAttribute('aria-hidden');
            });
            node.querySelectorAll('.nm, .tx').forEach(el => el.textContent = '');
            node.querySelectorAll('.secret-badge').forEach(el => el.remove());
            return node;
        }

        // 클릭하면 편집, 엔터로 확정. 렌더 직후와 새로 끼운 줄에 똑같이 걸어 준다.
        function wireEditing(root) {
            root.querySelectorAll('.gap span:not(.insimg)').forEach(span => {
                span.addEventListener('click', () => {
                    span.setAttribute('contenteditable', 'true');
                    span.focus();
                });
                span.addEventListener('blur', () => span.removeAttribute('contenteditable'));
                span.addEventListener('keydown', e => {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); span.blur(); }
                });
            });
        }

        // 이미지만 들어가는 줄. 이름칸·초상화칸 없이 그림 한 장만 놓는다.
        function stripToImageRow(node) {
            node.classList.add('image-row');
            node.querySelectorAll('.msg_container, .nm, p > br').forEach(el => el.remove());
            node.querySelectorAll('.tx').forEach(el => el.textContent = '');
            return node;
        }

        // 비어 있는 이미지 칸을 하나 끼운다. 여기에 Ctrl+V로 이미지를 붙여넣으면 된다.
        function insertImageRowAfter(gap) {
            const source = gap.__msg;
            const channel = source?.channel || [...blankRowTemplates.keys()][0];
            const template = blankRowTemplates.get(channel);
            if (!template) return null;

            const msg = {
                name: '', text: '', icon: '', exportIcon: '', color: source?.color || '#ccc',
                channel, date: '', imageOnly: true
            };
            const index = window.allMessages.indexOf(source);
            if (index >= 0) window.allMessages.splice(index + 1, 0, msg);
            else window.allMessages.push(msg);

            const node = stripToImageRow(template.cloneNode(true));
            node.__msg = msg;
            node.querySelectorAll('.tx').forEach(el => attachImagePaste(el, msg));
            // 줄이 하나 늘었으니 이 묶음의 고정 높이는 더 이상 맞지 않는다.
            const chunk = gap.closest('.vchunk');
            if (chunk) { chunk.classList.remove('off'); chunk.style.height = ''; }
            gap.after(node);
            wireEditing(node);
            ensureImageRowRule();
            scheduleChunkUpdate();
            node.querySelector('.tx')?.click(); // 바로 붙여넣을 수 있게 포커스
            return node;
        }

        // 비어 있는 칸은 아무것도 안 보이면 누를 수가 없으니 자리 표시를 깔아 준다.
        // 이미지가 들어가면 :empty가 풀려 저절로 사라지므로 내보낸 파일에도 안 보인다.
        // 내보내기 쪽 CSS에 span:before{display:none!important}가 있어 display도 !important로 되돌려야 한다.
        const IMAGE_ROW_RULE = ".ccfolia_wrap .image-row p,.ccfolia_wrap .image-row .tx{display:block;width:100%}\n.ccfolia_wrap .image-row .tx:empty::before{content:'이미지를 붙여넣기 (Ctrl+V)';display:block!important;padding:18px;border:1px dashed currentColor;border-radius:8px;opacity:.5;text-align:center}";
        function ensureImageRowRule() {
            const style = previewArea.querySelector('.ccfolia_wrap style');
            if (style && !style.textContent.includes('.image-row .tx:empty')) style.textContent += '\n' + IMAGE_ROW_RULE;
        }

        // 출력 탭 설정 상태와 저널별 이미지 override
        let tabSettings = new Map();
        let journalImages = {};
        let journalLinks = {};
        let activeOutputTab = '';

        function initTabSettings() {
            tabSettings = new Map([...new Set(window.allMessages.map(m => m.channel))].map(channel => [channel, {
                enabled: isMainTab(channel),
                badge: false,
                portrait: !isBubbleTab(channel),
                compact: false,
                customUrl: ''
            }]));
        }

        function renderChannelFilter() {
            // 출력 탭은 팝업에서만 관리한다.
        }

        function syncStyleChannelVisibility() {
            document.querySelectorAll('#channelColorSettings label[data-channel]').forEach(label => {
                label.style.display = tabSettings.get(label.dataset.channel)?.enabled === false ? 'none' : '';
            });
        }

        function applyPreviewTabVisibility() {
            // .gap.other-compact 등이 display를 !important로 잡고 있어서, 그냥 인라인으로
            // display:none을 넣으면 밀린다. 숨길 때는 우선순위를 맞춰 준다.
            previewArea.querySelectorAll('[data-channel]').forEach(node => {
                if (tabSettings.get(node.dataset.channel)?.enabled === false) node.style.setProperty('display', 'none', 'important');
                else node.style.removeProperty('display');
            });
        }

        async function regeneratePreview(message = '로그 화면을 다시 생성 중...') {
            const overlay = document.getElementById('progressOverlay');
            document.getElementById('progressText').textContent = message;
            overlay.classList.add('show');
            await new Promise(requestAnimationFrame);
            await new Promise(requestAnimationFrame);
            try { renderMessages(); } finally { overlay.classList.remove('show'); }
        }

        function renderTabDetail(channel) {
            activeOutputTab = channel;
            const detail = document.getElementById('outputTabDetail');
            detail.innerHTML = '';
            const setting = tabSettings.get(channel);
            const heading = document.createElement('b'); heading.textContent = `[${channel}] 이미지 설정`;
            detail.appendChild(heading);
            if (true) {
                const link = document.createElement('input');
                link.className = 'link-input'; link.placeholder = '이 탭 전체에 사용할 이미지 링크 (선택)'; link.value = setting.customUrl;
                link.onchange = () => { setting.customUrl = link.value.trim(); applyImportedPortraits(); renderMessages(); };
                detail.appendChild(link);
                const names = [...new Set(window.allMessages.filter(m => m.channel === channel).map(m => m.name).filter(Boolean))];
                names.forEach(name => {
                    const candidates = pluginPortraits.get(name) || [];
                    if (!candidates.length) return;
                    const row = document.createElement('div'); row.className = 'journal-row';
                    const label = document.createElement('span'); label.className = 'journal-name'; label.textContent = name; row.appendChild(label);
                    candidates.forEach(url => {
                        const button = document.createElement('button'); button.type = 'button'; button.className = 'portrait-option';
                        if (journalImages[`${channel}|${name}`] === url) button.classList.add('active');
                        const img = document.createElement('img'); img.src = url; img.alt = name; button.appendChild(img);
                        button.onclick = () => { journalImages[`${channel}|${name}`] = url; applyImportedPortraits(); renderTabDetail(channel); renderMessages(); };
                        row.appendChild(button);
                    });
                    detail.appendChild(row);
                });
            } else {
                const note = document.createElement('span'); note.style.cssText = 'display:block;color:#6b7280;font-size:12px;margin-top:8px'; note.textContent = '이 탭은 저널명과 내용만 출력하며 이미지·서술자 설정을 사용하지 않습니다.'; detail.appendChild(note);
            }
        }

        function renderOutputTabSettings() {
            const list = document.getElementById('outputTabList'); list.innerHTML = '';
            for (const [channel, setting] of tabSettings) {
                const row = document.createElement('div'); row.className = 'modal-tab-row';
                const open = document.createElement('button'); open.type = 'button'; open.className = 'tab-setting-btn' + (setting.enabled ? '' : ' tab-disabled'); open.textContent = channel; open.onclick = () => openJournalImageModal(channel);
                const output = document.createElement('label'); output.className = 'output-switch'; output.title = '출력 여부'; const outputCheck = document.createElement('input'); outputCheck.type = 'checkbox'; outputCheck.checked = setting.enabled; const slider = document.createElement('span'); slider.className = 'output-slider'; output.append(outputCheck, slider);
                const badge = document.createElement('button'); badge.type = 'button'; badge.className = 'tab-toggle' + (setting.badge ? ' active' : ''); badge.textContent = '뱃지'; badge.onclick = () => { setting.badge = !setting.badge; badge.classList.toggle('active', setting.badge); renderMessages(); };
                const portrait = document.createElement('button'); portrait.type = 'button'; portrait.className = 'tab-toggle' + (setting.portrait ? ' active' : ''); portrait.textContent = '포트레'; portrait.onclick = () => { setting.portrait = !setting.portrait; portrait.classList.toggle('active', setting.portrait); applyImportedPortraits(); renderMessages(); };
                let compact;
                if (isOtherTab(channel)) {
                    compact = document.createElement('button'); compact.type = 'button'; compact.className = 'tab-toggle' + (setting.compact ? ' active' : ''); compact.textContent = '간략화'; compact.onclick = () => { setting.compact = !setting.compact; compact.classList.toggle('active', setting.compact); syncDisabled(); renderMessages(); };
                }
                const syncDisabled = () => {
                    [badge, portrait].forEach(button => { button.classList.toggle('tab-option-disabled', !setting.enabled || setting.compact); button.disabled = !setting.enabled || setting.compact; });
                    if (compact) { compact.classList.toggle('tab-option-disabled', !setting.enabled); compact.disabled = !setting.enabled; }
                };
                outputCheck.onchange = () => { setting.enabled = outputCheck.checked; open.classList.toggle('tab-disabled', !setting.enabled); syncDisabled(); syncStyleChannelVisibility(); setTimeout(() => regeneratePreview('출력 탭을 다시 생성 중...'), 0); };
                row.append(output, open, badge, portrait, ...(compact ? [compact] : []));
                syncDisabled();
                list.appendChild(row);
            }
            document.getElementById('outputTabDetail').innerHTML = '<span style="color:#6b7280;font-size:12px;">스위치로 출력 여부를 바꾸고, 탭 제목을 누르면 저널별 이미지 설정이 열립니다.</span>';
        }

        // 그 탭 메시지에 초상화가 이미 박혀 있으면 저널별 이미지 핀은 필요 없다.
        // 핀을 걸면 로그 중간의 초상화 교체가 한 장으로 납작해지므로 오히려 손해다.
        const channelHasOwnPortraits = channel => window.allMessages.some(m => m.channel === channel && m.exportIcon);

        function openJournalImageModal(channel) {
            activeOutputTab = channel;
            const list = document.getElementById('journalImageList');
            const note = document.getElementById('journalImageModalNote');
            list.innerHTML = '';
            if (isMainTab(channel) || channelHasOwnPortraits(channel)) {
                note.textContent = `[${channel}] 탭은 로그에 기록된 메시지별 초상화를 그대로 사용합니다.`;
                list.innerHTML = '<p class="image-fallback">따로 지정할 필요가 없어 잠겨 있습니다. 초상화를 아예 빼려면 출력 탭 설정의 「포트레」를 끄세요.</p>';
                document.getElementById('journalImageModal').classList.remove('hidden');
                return;
            }
            note.textContent = `[${channel}] 탭에서 발화한 저널별 이미지입니다. 정사각형 썸네일을 눌러 선택하세요.`;
            {
                const names = [...new Set(window.allMessages.filter(m => m.channel === channel).map(m => m.name).filter(Boolean))];
                names.forEach(name => {
                    const key = `${channel}|${name}`, candidates = pluginPortraits.get(name) || [];
                    const block = document.createElement('section'); block.className = 'image-journal-block';
                    const title = document.createElement('div'); title.className = 'image-journal-title'; title.textContent = name; block.appendChild(title);
                    const grid = document.createElement('div'); grid.className = 'image-choice-grid';
                    const currentImage = journalImages[key] || journalLinks[key] || tabSettings.get(channel)?.customUrl || candidates.at(-1) || '';
                    candidates.forEach(url => {
                        const button = document.createElement('button'); button.type = 'button'; button.className = 'image-choice' + (currentImage === url ? ' active' : '');
                        const image = document.createElement('img'); image.src = url; image.alt = name + ' 포트레이트'; button.appendChild(image);
                        button.onclick = () => { journalImages[key] = url; delete journalLinks[key]; applyImportedPortraits(); openJournalImageModal(channel); renderMessages(); };
                        grid.appendChild(button);
                    });
                    if (candidates.length) block.appendChild(grid);
                    const link = document.createElement('input'); link.className = 'link-input'; link.placeholder = '이미지 링크로 대체 (선택)'; link.value = journalLinks[key] || tabSettings.get(channel)?.customUrl || '';
                    link.onchange = () => { journalLinks[key] = link.value.trim(); delete journalImages[key]; applyImportedPortraits(); renderMessages(); };
                    block.appendChild(link);
                    if (!candidates.length) { const note = document.createElement('div'); note.className = 'image-fallback'; note.textContent = 'main에서 같은 이름의 저널 이미지를 찾지 못했습니다. 링크를 입력하세요.'; block.appendChild(note); }
                    list.appendChild(block);
                });
                if (!list.children.length) list.innerHTML = '<p class="image-fallback">이 탭에서 저널을 찾지 못했습니다.</p>';
            }
            document.getElementById('journalImageModal').classList.remove('hidden');
        }

        document.getElementById('outputTabSettingsBtn').onclick = () => { renderOutputTabSettings(); document.getElementById('outputTabModal').classList.remove('hidden'); };
        document.getElementById('outputTabModalClose').onclick = () => document.getElementById('outputTabModal').classList.add('hidden');
        document.getElementById('outputTabModal').addEventListener('click', e => { if (e.target.id === 'outputTabModal') e.target.classList.add('hidden'); });
        document.getElementById('journalImageModalClose').onclick = () => document.getElementById('journalImageModal').classList.add('hidden');
        document.getElementById('journalImageModal').addEventListener('click', e => { if (e.target.id === 'journalImageModal') e.target.classList.add('hidden'); });
    </script>
</body>

</html>
