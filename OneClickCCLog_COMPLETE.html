<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>껍질 미리-깐 코코포 로그</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            padding: 20px 18px;
            background-color: #ffffff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar h2 {
            margin: 0 0 4px;
            font-size: 16px;
            font-weight: 700;
            color: #111827;
        }

        .sidebar>p {
            margin: 0;
            font-size: 12px;
            line-height: 1.6;
            color: #6b7280;
        }

        .sidebar>p a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .sidebar>p a:hover {
            text-decoration: underline;
        }

        .sidebar>hr {
            margin: 8px 0 4px;
            border: 0;
            border-top: 1px solid #e5e7eb;
        }

        .preview {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: #1f1e22;
            color: white;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 9px 10px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            background-color: #ffffff;
            color: #111827;
            transition: background-color 0.15s, border-color 0.15s, box-shadow 0.15s;
        }

        button:hover {
            background-color: #f3f4f6;
            border-color: #2563eb;
            box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.25);
        }

        .sidebar-tabs {
            display: flex;
            margin-top: 10px;
            border-radius: 999px;
            padding: 2px;
            background-color: #e5e7eb;
            gap: 2px;
        }

        .sidebar-tab {
            flex: 1;
            padding: 6px 0;
            font-size: 12px;
            background-color: transparent;
            border: none;
            cursor: pointer;
            text-align: center;
            border-radius: 999px;
            color: #6b7280;
        }

        .sidebar-tab.active {
            background-color: #2563eb;
            color: #f9fafb;
        }

        .tab-panel {
            margin-top: 10px;
            padding: 10px 10px 8px;
            border-radius: 10px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tab-panel.hidden {
            display: none;
        }

        /* sidebar form controls */
        label {
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: #374151;
        }

        .sidebar input[type="text"],
        .sidebar input[type="number"],
        .sidebar input[type="color"] {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 12px;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #111827;
        }

        .sidebar input[type="color"] {
            height: 36px;
            cursor: pointer;
        }

        .sidebar input[type="text"]::placeholder,
        .sidebar input[type="number"]::placeholder {
            color: #9ca3af;
        }

        .sidebar input[type="text"]:focus,
        .sidebar input[type="number"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.35);
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
        }

        /* tab-narrator modern layout */
        #tab-narrator {
            flex-direction: column;
            gap: 8px;
        }

        #tab-narrator label {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #tab-narrator label:last-child {
            flex-direction: row;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        #tab-narrator input[type="text"] {
            width: 100%;
            box-sizing: border-box;
        }

        #tab-narrator input[type="checkbox"] {
            width: auto;
        }

        /* tab-style 동일 스타일 */
        #tab-style label:last-child {
            flex-direction: row;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        #tab-style input[type="checkbox"] {
            width: auto;
        }

        p {
            margin: 0;
        }

        b {
            color: gray;
            font-size: 9pt;
            font-weight: 200;
        }

        span,
        b {
            font-size: 16px;
            font-family: 'Arial', sans-serif;
            line-height: 1.5;
        }

        .preview p,
        .preview span,
        .preview b {
            white-space: pre-wrap;
        }

        /* 기본 다크 배경 / 글꼴 색 (채널 색상 적용 전 초기 상태) */
        .preview .ccfolia_wrap {
            background-color: #1f1e22;
            color: #ddd;
        }

        b {
            font-weight: bold;
        }

        .ccfolia_wrap {
            position: relative;
            background-color: #2c2c2cde;
            color: #fefefe;
        }

        .msg_container {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .msg_container img {
            width: 40px;
        }

        span:before {
            display: none !important;
        }


        .gap {
            gap: 15px;
            display: flex;
            -webkit-box-pack: start;
            justify-content: flex-start;
            align-items: flex-start;
            position: relative;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
            text-align: left;
            padding: 16px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        hr {
            display: none;
        }

        /* 화면 밖 묶음은 높이만 남기고 접어 둔다 (편집 렉 방지, 미리보기 전용) */
        #previewArea .vchunk.off {
            overflow: hidden;
        }

        #previewArea .vchunk.off > * {
            display: none !important;
        }

        /* 전역 삭제 / 줄 삽입 버튼 */
        #globalInsertBtn {
            position: fixed;
            background: rgba(60, 130, 255, 0.8);
            border: none;
            color: white;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            z-index: 9999;
            width: 24px;
            height: 24px;
            font-size: 14px;
            line-height: 1;
        }

        #globalDeleteBtn {
            position: fixed;
            background: rgba(255, 50, 50, 0.8);
            border: none;
            color: white;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            z-index: 9999;
            pointer-events: auto;
            width: 24px;
            height: 24px;
            font-size: 14px;
            line-height: 1;
        }

        .preview .gap:hover,
        .preview .player.system:hover {
            outline: 1px solid rgba(255, 50, 50, 0.3);
        }

        /* 비밀 메시지 뱃지 */
        .secret-badge {
            display: inline-block;
            background-color: #ffffff2b;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
            position: absolute;
            right: 16px;
            top: 8px;
            z-index: 10;
        }

        /* Light theme overrides */
        .preview.light {
            background-color: #f1f1f1;
            color: #000000;
        }

        .preview.light .ccfolia_wrap {
            background-color: #f9fafb !important;
        }

        .preview.light .gap {
            border-top-color: rgba(0, 0, 0, 0.1);
        }

        .preview.light p,
        .preview.light span {
            color: #575757 !important;
        }

        .preview.light .msg_container {
            background: transparent !important;
        }

        .preview.light .player.system {
            background: rgb(0 0 0 / 4%) !important;
            border-top-color: rgba(0, 0, 0, 0.1) !important;
        }

        .preview.light .player.system .Uname {
            background: #0000001c !important;
            color: #5a6671 !important;
        }

        .preview.light .player.system .Utext {
            color: #4b5563 !important;
        }
        .preview .player.system { text-align: center; justify-content: center; }
        .preview .player.system { width: 100%; max-width: none; margin: 0; border-radius: 0; background: transparent !important; }
        .preview .player.system .textWrap { float: none !important; width: auto; max-width: calc(100% - 32px); box-sizing: border-box; margin: 0 auto !important; text-align: center; overflow-wrap: anywhere; }
        .preview .player.system .Uname { display: table; width: auto; margin-left: auto !important; margin-right: auto !important; }
        .preview .player.system .Utext { text-align: center; }

        .preview.light .secret-badge {
            background-color: #0000002b;
            color: #111827;
        }

        .portrait-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .portrait-option {
            width: 52px;
            height: 52px;
            padding: 2px;
            border: 2px solid #d1d5db;
            border-radius: 7px;
            background: #f3f4f6;
            cursor: pointer;
        }
        .portrait-option.active { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }
        .portrait-option img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
        .portrait-option img { object-position: top center; }
        .tab-setting-btn { width: 100%; text-align: left; display: flex; align-items: center; justify-content: space-between; }
        .tab-setting-btn.active { border-color: #2563eb; background: #eff6ff; }
        .tab-setting-meta { color: #6b7280; font-size: 11px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .modal-overlay.hidden { display: none; }
        .modal-panel { background: #fff; color: #111827; border-radius: 12px; padding: 18px; width: min(560px, calc(100vw - 32px)); max-height: 85vh; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 16px; }
        .modal-close { border: 0; background: transparent; font-size: 18px; padding: 4px; }
        .modal-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .modal-tab-row { display: grid; grid-template-columns: auto 1fr repeat(3, auto); gap: 8px; align-items: center; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; font-size: 12px; }
        .modal-tab-row label { flex-direction: row; align-items: center; gap: 4px; white-space: nowrap; }
        .output-switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; display: block; cursor: pointer; }
        .output-switch input { position: absolute; inset: 0; z-index: 2; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
        .output-slider { position: absolute; inset: 0; border-radius: 999px; background: #c7cbd1; cursor: pointer; transition: .2s; }
        .output-slider:before { content: ''; display: block !important; position: absolute; z-index: 1; width: 18px; height: 18px; left: 2px; top: 2px; border-radius: 50%; background: #fff !important; transition: .2s; box-shadow: 0 1px 3px #0004; }
        .output-switch input:checked + .output-slider { background: #2563eb; }
        .output-switch input:checked + .output-slider:before { transform: translateX(16px); }
        .tab-setting-btn.tab-disabled { color: #9ca3af; background: #f3f4f6; border-color: #d1d5db; }
        .tab-option-disabled { opacity: .4; }
        .tab-toggle { padding: 5px 8px; border-radius: 999px; font-size: 11px; white-space: nowrap; border: 1px solid #d1d5db; background: #fff; color: #6b7280; cursor: pointer; }
        .tab-toggle.active { color: #fff; background: #2563eb; border-color: #2563eb; }
        .tab-toggle:disabled { opacity: .35; cursor: not-allowed; }
        #progressOverlay { display:none; position:fixed; inset:0; z-index:20000; background:rgba(0,0,0,.28); align-items:flex-start; justify-content:center; pointer-events:none; }
        #progressOverlay.show { display:flex; }
        .progress-box { margin-top:18px; width:min(420px,calc(100vw - 32px)); padding:12px 14px; border-radius:10px; background:#fff; color:#111827; box-shadow:0 5px 20px #0004; font-size:12px; }
        .progress-track { height:6px; margin-top:8px; overflow:hidden; border-radius:99px; background:#e5e7eb; }
        .progress-fill { width:35%; height:100%; border-radius:99px; background:#2563eb; animation:progress-slide 1s ease-in-out infinite; }
        @keyframes progress-slide { 0%{transform:translateX(-120%)} 100%{transform:translateX(320%)} }
        .modal-detail { border-top: 1px solid #e5e7eb; padding-top: 10px; overflow-y: auto; }
        .image-modal-panel { width: min(760px, calc(100vw - 32px)); }
        .image-modal-list { overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .image-journal-block { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; }
        .image-journal-title { font-weight: 700; font-size: 13px; margin-bottom: 8px; }
        .image-choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 10px; }
        .image-choice { aspect-ratio: 1; min-width: 0; padding: 3px; border: 2px solid #d1d5db; border-radius: 9px; background: #f3f4f6; cursor: pointer; }
        .image-choice.active { border-color: #2563eb; box-shadow: 0 0 0 2px #93c5fd; }
        .image-choice img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; border-radius: 6px; }
        .image-fallback { color: #6b7280; font-size: 12px; margin-top: 8px; }
        .gap.other-compact { display: block !important; padding: 4px 16px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gap.other-compact .compact-name { font-weight: 700; margin-right: 6px; }
        .gap.other-compact .compact-text { color: #ddd; }
        .preview.light .gap.other-compact .compact-text { color: #575757; }
        .preview .gap.info-message.bubble-themed,
        .preview .gap.other-message.bubble-themed {
            width: 100%;
            margin: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }
        .preview .gap.info-message.bubble-themed {
            padding: 4px 16px !important;
        }
        .preview .gap.other-message.bubble-themed {
            margin-top: 0;
            margin-bottom: 0;
            border: 0;
            border-radius: 20px;
            padding: 2px 16px !important;
            background-color: var(--main-card-color) !important;
        }
        .preview .gap.info-message.bubble-themed .bubble-surface,
        .preview .gap.other-message.bubble-themed .bubble-surface {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            padding: 8px 12px;
            border-radius: 16px;
            background-color: var(--bubble-color) !important;
        }
        .preview .gap.info-message.bubble-themed .bubble-surface { border-radius: 12px; }
        .preview .gap.info-message.bubble-themed .bubble-surface {
            border: 1px solid rgba(255,255,255,.12);
            border-left: 4px solid rgba(255,255,255,.45);
            box-shadow: 0 3px 10px rgba(0,0,0,.12);
        }
        .preview .gap.other-message.bubble-themed.other-compact .bubble-surface {
            display: block;
            padding: 7px 12px;
            border-radius: 16px;
        }
        .preview .gap.other-message.other-compact {
            padding: 7px 12px !important;
            border-radius: 0;
        }
        .preview.light .gap.info-message.bubble-themed,
        .preview.light .gap.other-message.bubble-themed { border-color: transparent; box-shadow: none; }
        .preview.light .gap.info-message.bubble-themed .bubble-surface {
            border-color: rgba(0,0,0,.1);
            border-left-color: rgba(0,0,0,.22);
            box-shadow: 0 3px 10px rgba(0,0,0,.06);
        }
        .journal-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
        .journal-name { width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .link-input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; }
        /* 로그 파일 드롭존 */
        .dropzone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 20px 14px;
            border: 1.5px dashed #cbd5e1;
            border-radius: 12px;
            background-color: #f9fafb;
            text-align: center;
            cursor: pointer;
            transition: border-color .15s, background-color .15s, box-shadow .15s;
        }

        .dropzone:hover,
        .dropzone:focus-visible {
            border-color: #2563eb;
            background-color: #eff6ff;
            outline: none;
        }

        .dropzone.dragover {
            border-color: #2563eb;
            background-color: #dbeafe;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
        }

        .dropzone svg {
            width: 26px;
            height: 26px;
            color: #9ca3af;
            transition: color .15s;
        }

        .dropzone:hover svg,
        .dropzone.dragover svg { color: #2563eb; }

        .dropzone-title { font-size: 13px; font-weight: 600; color: #374151; }
        .dropzone-hint { font-size: 11px; color: #9ca3af; line-height: 1.5; }

        .file-chips { display: flex; flex-direction: column; gap: 6px; }

        .file-chips:empty { display: none; }

        .file-chip {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 7px 6px 8px;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            background-color: #ffffff;
            font-size: 11.5px;
            color: #374151;
        }

        .file-chip .kind {
            flex-shrink: 0;
            padding: 2px 6px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
        }

        .file-chip .kind.export { background-color: #dbeafe; color: #1d4ed8; }
        .file-chip .kind.plugin { background-color: #ede9fe; color: #6d28d9; }
        .file-chip .kind.unknown { background-color: #fee2e2; color: #b91c1c; }

        .file-chip .fname {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            direction: rtl;
            text-align: left;
        }

        .file-chip .count { flex-shrink: 0; color: #9ca3af; font-variant-numeric: tabular-nums; }

        .file-chip .remove {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            padding: 0;
            line-height: 1;
            font-size: 15px;
            border: 0;
            border-radius: 6px;
            background-color: transparent;
            color: #9ca3af;
        }

        .file-chip .remove:hover { background-color: #fee2e2; color: #b91c1c; box-shadow: none; }

        body.light .modal-panel { background: #fff; }
    </style>
</head>

<body>
    <div id="progressOverlay"><div class="progress-box"><span id="progressText">로그를 불러오는 중...</span><div class="progress-track"><div class="progress-fill"></div></div></div></div>
    <div class="container">
        <div class="sidebar">
            <h2>껍질 미리-깐 코코포 로그 (완전판!)</h2>
            <hr />
            <div class="dropzone" id="logDropzone" tabindex="0" role="button" aria-label="로그 HTML 파일 선택">
                <input type="file" id="logFileInput" accept=".html,.htm" multiple hidden />
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <path d="M7 9l5-5 5 5" />
                    <path d="M12 4v12" />
                </svg>
                <span class="dropzone-title">로그 HTML을 끌어다 놓기</span>
                <span class="dropzone-hint">클릭해서 선택 · 여러 개 한꺼번에 가능<br />코코포리아 내보내기 / 이전 로그 플러그인 자동 판별</span>
            </div>
            <div class="file-chips" id="logFileChips"></div>
            <label>
                저장 파일명(선택):
                <input type="text" id="roomInput" placeholder="ccfolia-wrap" />
            </label>
            <button type="button" id="outputTabSettingsBtn">출력 탭 설정</button>

            <div class="sidebar-tabs">
                <button type="button" class="sidebar-tab active" data-target="tab-narrator">서술자 설정</button>
                <button type="button" class="sidebar-tab" data-target="tab-style">스타일 설정</button>
            </div>

            <div id="tab-narrator" class="tab-panel">
                <label>
                    서술자 이름:
                    <input type="text" id="narratorInput" placeholder="이름 정확히 입력" />
                </label>
                <label style="flex-direction: row; align-items: center; gap: 6px;">
                    <input type="checkbox" id="removeNarratorItalicCheckbox" style="width:auto;" /> 서술자 기울임 제거
                </label>
            </div>

            <div id="tab-style" class="tab-panel hidden">
                <label style="flex-direction: row; align-items: center; gap: 6px;">
                    패딩 (상하 px):
                    <input type="number" id="paddingInput" value="16" min="0" />
                    폰트 크기 (px):
                    <input type="number" id="fontSizeInput" value="16" min="8" max="32" />
                </label>
                <label style="flex-direction: row; align-items: center; gap: 6px;">
                    삽입 이미지 최대 폭 (px):
                    <input type="number" id="imageMaxWidth" value="800" min="100" max="2000" step="50" />
                </label>
                <p style="margin:0;font-size:12px;color:#6b7280;line-height:1.5;">
                    본문을 클릭해 편집 상태로 만든 뒤 이미지를 붙여넣기(Ctrl+V)하면 커서 위치에 삽입됩니다.
                    삽입 시 위 최대 폭으로 줄이고 WebP로 다시 인코딩합니다.
                </p>
                <div id="channelColorSettings">
                    <!-- 동적으로 채널별 색상 설정이 추가됩니다 -->
                </div>
                <label style="flex-direction: row; align-items: center; gap: 6px;">
                    <input type="checkbox" id="lightThemeToggle" /> 라이트 테마
                </label>
                <label style="flex-direction: row; align-items: center; gap: 6px;">
                    <input type="checkbox" id="bubbleThemeToggle" checked /> info/other 말풍선 테마
                </label>
            </div>

            <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px;">
                <button id="applyStyleBtn">스타일 적용</button>
                <button id="saveHTMLBtn">HTML 저장</button>
                <button id="saveTxtBtn">TXT 저장</button>
            </div>

        </div>

        <div class="preview" id="previewArea"></div>
    </div>

    <button id="globalInsertBtn" title="이 줄 바로 아래에 이미지 칸 추가">＋</button>
    <button id="globalDeleteBtn">✕</button>

    <div id="outputTabModal" class="modal-overlay hidden">
        <div class="modal-panel">
            <div class="modal-header"><h3>출력 탭 설정</h3><button type="button" class="modal-close" id="outputTabModalClose">✕</button></div>
            <div id="outputTabList" class="modal-list"></div>
            <div id="outputTabDetail" class="modal-detail"><span style="color:#6b7280;font-size:12px;">탭을 선택하면 저널별 이미지 설정이 표시됩니다.</span></div>
        </div>
    </div>
    <div id="journalImageModal" class="modal-overlay hidden">
        <div class="modal-panel image-modal-panel">
            <div class="modal-header"><h3>저널별 이미지 설정</h3><button type="button" class="modal-close" id="journalImageModalClose">✕</button></div>
            <p id="journalImageModalNote" style="margin:0;color:#6b7280;font-size:12px;"></p>
            <div id="journalImageList" class="image-modal-list"></div>
        </div>
    </div>

    <script>
        const previewArea = document.getElementById('previewArea');
        const styleButton = document.getElementById('applyStyleBtn');
        const paddingInput = document.getElementById('paddingInput');
        const fontSizeInput = document.getElementById('fontSizeInput');

        // ─── 채널 종류 판별 ────────────────────────────────────────
        // 코코포리아 기본 탭은 방 언어에 따라 라벨이 달라진다(main/메인, info/정보, other/잡담).
        // 성격이 같은 탭이 같은 디자인으로 나가도록 판별을 여기 한 곳에 모은다.
        const isMainTab = channel => /main|메인/i.test(channel || '');
        const isInfoTab = channel => /info|정보/i.test(channel || '');
        const isOtherTab = channel => /other|잡담|사담/i.test(channel || '');
        const isBubbleTab = channel => isInfoTab(channel) || isOtherTab(channel);

        // 사이드바 탭 전환
        const sidebarTabs = document.querySelectorAll('.sidebar-tab');
        const tabPanels = document.querySelectorAll('.tab-panel');

        sidebarTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const targetId = tab.getAttribute('data-target');

                sidebarTabs.forEach(t => t.classList.remove('active'));
                tabPanels.forEach(panel => {
                    if (panel.id === targetId) {
                        panel.classList.remove('hidden');
                    } else {
                        panel.classList.add('hidden');
                    }
                });

                tab.classList.add('active');
            });
        });

        // 전역 삭제 버튼 로직
        const globalDeleteBtn = document.getElementById('globalDeleteBtn');
        const globalInsertBtn = document.getElementById('globalInsertBtn');
        const hoverButtons = [globalDeleteBtn, globalInsertBtn];
        let currentHoverGap = null;

        const showHoverButtons = (show) => hoverButtons.forEach(b => b.style.display = show ? 'block' : 'none');

        // 이벤트 위임 방식으로 변경
        document.addEventListener('mouseover', (e) => {
            const hovered = e.target.closest('.gap') || e.target.closest('.player.system');
            if (hovered && previewArea.contains(hovered)) {
                currentHoverGap = hovered;
                const rect = hovered.getBoundingClientRect();
                globalDeleteBtn.style.left = (rect.right - 30) + 'px';
                globalDeleteBtn.style.top = (rect.top + 5) + 'px';
                globalInsertBtn.style.left = (rect.right - 60) + 'px';
                globalInsertBtn.style.top = (rect.top + 5) + 'px';
                showHoverButtons(true);
            } else if (!e.target.closest('#globalDeleteBtn, #globalInsertBtn')) {
                // 버튼 위가 아니고 대상 위도 아니면 숨김
                if (currentHoverGap && !currentHoverGap.contains(e.target)) {
                    showHoverButtons(false);
                    currentHoverGap = null;
                }
            }
        });

        globalDeleteBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!currentHoverGap) return;
            // DOM만 지우면 다시 그릴 때 되살아난다. 원본 목록에서도 뺀다.
            const index = window.allMessages.indexOf(currentHoverGap.__msg);
            if (index >= 0) window.allMessages.splice(index, 1);
            currentHoverGap.remove();
            showHoverButtons(false);
            currentHoverGap = null;
        });

        globalInsertBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!currentHoverGap) return;
            insertImageRowAfter(currentHoverGap);
            showHoverButtons(false);
            currentHoverGap = null;
        });

        // 버튼 위에 마우스가 있을 때 버튼 유지
        hoverButtons.forEach(btn => btn.addEventListener('mouseenter', () => {
            if (currentHoverGap) showHoverButtons(true);
        }));

        // 라이트 테마 토글
        const lightThemeToggle = document.getElementById('lightThemeToggle');
        const bubbleThemeToggle = document.getElementById('bubbleThemeToggle');
        let bubbleThemeEnabled = true;
        let bubbleOriginalColors = {};
        let bubbleCustomColors = new Set();
        
        // 저장된 채널 색상을 저장할 변수
        let savedChannelColors = {};
        
        lightThemeToggle.addEventListener('change', () => {
            if (lightThemeToggle.checked) {
                // 현재 채널 색상 저장
                const channelSet = new Set(window.allMessages.map(m => m.channel));
                channelSet.forEach(channel => {
                    const colorInput = document.getElementById(`channelColor_${channel}`);
                    if (colorInput) {
                        savedChannelColors[channel] = colorInput.value;
                    }
                });
                
                // 라이트 테마 색상으로 변경
                channelSet.forEach(channel => {
                    const colorInput = document.getElementById(`channelColor_${channel}`);
                    if (colorInput) {
                        // 메인 채널은 #f1f1f1, 이외는 #E3E3E3
                        const lightColor = (isBubbleTab(channel))
                            ? mixHex('#f1f1f1', '#000000', 0.07)
                            : ((isMainTab(channel)) ? '#f1f1f1' : '#E3E3E3');
                        colorInput.value = lightColor;
                        channelColors[channel] = lightColor;
                    }
                });
                
                previewArea.classList.add('light');
            } else {
                // 저장된 원래 색상 복원
                const channelSet = new Set(window.allMessages.map(m => m.channel));
                channelSet.forEach(channel => {
                    const colorInput = document.getElementById(`channelColor_${channel}`);
                    if (colorInput && savedChannelColors[channel]) {
                        colorInput.value = savedChannelColors[channel];
                        channelColors[channel] = colorInput.value;
                    }
                });
                
                previewArea.classList.remove('light');
            }
            
            // 메시지 다시 렌더링
            if (window.allMessages && window.allMessages.length > 0) {
                renderMessages();
            }
        });

        bubbleThemeToggle.addEventListener('change', () => {
            bubbleThemeEnabled = bubbleThemeToggle.checked;
            if (window.allMessages?.length) {
                const channels = [...new Set(window.allMessages.map(m => m.channel))].filter(channel => isBubbleTab(channel));
                if (bubbleThemeEnabled) bubbleCustomColors.clear();
                channels.forEach(channel => {
                    const colorInput = document.getElementById(`channelColor_${channel}`);
                    if (bubbleThemeEnabled) {
                        if (colorInput) bubbleOriginalColors[channel] = colorInput.value;
                        const color = mixHex(getMainChannelColor(), lightThemeToggle.checked ? '#000000' : '#ffffff', 0.07);
                        if (colorInput) colorInput.value = color;
                        channelColors[channel] = color;
                    } else {
                        const color = bubbleOriginalColors[channel] || (lightThemeToggle.checked ? '#E3E3E3' : '#3d3d3d');
                        if (colorInput) colorInput.value = color;
                        channelColors[channel] = color;
                    }
                });
            }
            saveSettings();
            if (window.allMessages?.length) renderMessages();
        });

        function applyBubbleDefaultColors(force = false) {
            const color = mixHex(getMainChannelColor(), lightThemeToggle.checked ? '#000000' : '#ffffff', 0.07);
            [...new Set(window.allMessages.map(m => m.channel))]
                .filter(channel => isBubbleTab(channel))
                .forEach(channel => {
                    if (!force && bubbleCustomColors.has(channel)) return;
                    const colorInput = document.getElementById(`channelColor_${channel}`);
                    if (colorInput) colorInput.value = color;
                    channelColors[channel] = color;
                });
        }

        // 스타일 적용 버튼
        styleButton.addEventListener('click', () => {
            // Firestore 메시지가 로드되어 있으면 다시 렌더링
            if (window.allMessages && window.allMessages.length > 0) {
                renderMessages();
            } else {
                // HTML 파일 로드 방식일 경우
                applyStyleToPreviewArea();
            }
        });

        function applyStyleToPreviewArea() {
            const paddingValue = paddingInput.value || "16";
            const doc = previewArea;
            const narratorName = document.getElementById('narratorInput')?.value?.trim();

            // 배경색
            doc.querySelectorAll('.ccfolia_wrap').forEach(el => {
                el.style.backgroundColor = '#1f1e22';
            });

            // SYSTEM 형식 변환
            doc.querySelectorAll('.gap').forEach(old => {
                const systemSpan = old.querySelector('span[style*="font-weight: bold"]');
                if (!systemSpan || systemSpan.innerText.trim().toLowerCase() !== 'system') return;

                const p = old.querySelector('p');
                const spans = p.querySelectorAll('span');
                const message = spans[spans.length - 1]?.innerText.trim();

                const newDiv = document.createElement('div');
                newDiv.className = 'player system';
                newDiv.style.cssText = `
          display: flex;
          overflow: hidden;
          padding: 0px;
          border-top: 1px solid rgba(255, 255, 255, 0.08);
          background: #33313b;
          text-align: center;
          justify-content: center;
        `;

                newDiv.innerHTML = `
          <div class="infoWrap" style="display: none">
            <div class="imgWrap" style="width: 40px;height: 40px;overflow: hidden;background-color: rgba(0, 0, 0, 0.31);float: left;border-radius: 5px"></div>
          </div>
          <div class="textWrap" style="float: left;line-height: 1.6;margin-left: 0;color: #FFFFFF;padding: 10px 20px">
            <p class="Uname" style="margin: 0px 0px 6px 0px;font-weight: 800;color: #858296;font-size: 13px;letter-spacing: 1px;padding: 3px 8px;border-radius: 15px;background: #000000">system</p>
            <p class="Utext" style="margin: 0;font-weight: 400;color: #908e9a;font-size: 15px;letter-spacing: -1px">${message}</p>
          </div>
        `;
                old.replaceWith(newDiv);
            });

            // 패딩 적용
            doc.querySelectorAll('.gap').forEach(el => {
                if (!el.querySelector('.msg_container')) {
                    el.style.padding = `${paddingValue}px 16px`;
                }
            });

            // 더블클릭 편집
            doc.querySelectorAll('.gap span').forEach(span => {
                span.addEventListener('click', () => {
                    span.setAttribute('contenteditable', 'true');
                    span.focus();
                });
                span.addEventListener('blur', () => {
                    span.removeAttribute('contenteditable');
                });
                span.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        if (e.shiftKey) {
                            // Shift+Enter: 줄바꿈 허용
                            return;
                        } else {
                            // Enter만: 편집 완료
                            e.preventDefault();
                            span.blur();
                        }
                    }
                });
            });

            if (narratorName) applyNarratorMode(narratorName);
        }

        // 출력에서 빠진 탭은 display:none으로 숨겨만 둔 상태다. 파일에는 아예 빼고,
        // 그 탭에서만 쓰던 초상화 규칙도 같이 버린다.
        function exportWrapHtml(wrap) {
            const clone = wrap.cloneNode(true);
            // 가상화용 묶음은 미리보기에서만 쓰는 것이라 통째로 벗긴다.
            clone.querySelectorAll('.vchunk').forEach(c => c.replaceWith(...c.childNodes));
            clone.querySelectorAll('[data-channel]').forEach(node => {
                if (node.style.getPropertyValue('display') === 'none') node.remove();
            });
            const style = clone.querySelector('style');
            if (style) {
                const used = new Set([...clone.querySelectorAll('[class]')].flatMap(el => [...el.classList]));
                const kept = style.textContent.split('\n')
                    .filter(rule => [...rule.matchAll(/\.(s\d+|avatar-image-\d+|insimg-\d+)\b/g)].some(m => used.has(m[1])) || !/\.(s\d+|avatar-image-\d+|insimg-\d+)\b/.test(rule));
                if (kept.length) style.textContent = kept.join('\n');
                else style.remove();
            }
            return clone.outerHTML;
        }

        const saveButton = document.getElementById('saveHTMLBtn');
        saveButton.addEventListener('click', () => {
            const wrap = previewArea.querySelector('.ccfolia_wrap');
            if (!wrap) {
                alert('.ccfolia_wrap 요소를 찾을 수 없습니다.');
                return;
            }


            const doctype = '<!DOCTYPE html>';
            const htmlOpen = '<html lang="en">';
            const htmlClose = '</html>';
            const head = `
    <head>
      <meta charset="UTF-8">
      <title>ccfolia-wrap Export</title>
      <style>

    .ccfolia_wrap p{
    margin: 0;
    white-space: pre-wrap;
    }

    .ccfolia_wrap b{
    color: gray;
        font-size: 9pt;
        font-weight: 200;
    }

    .ccfolia_wrap span, .ccfolia_wrap b {
        font-size: 16px;
        font-family: 'Arial', sans-serif;
        line-height: 1.5;
        white-space: pre-wrap;
    }

    b {
        font-weight: bold;
    }

    * {
    box-sizing: border-box;
    }

    body {
    margin: 0;
    }

    .ccfolia_wrap {
    position: relative;
    background-color: #2c2c2cde;
    color: #ddd;
    }
    .msg_container {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    }

    .msg_container img {
    width: 40px;
    }

    span:before {
    display: none !important ;
    }


    .gap{
    gap: 15px;
    display: flex;
    -webkit-box-pack: start;
    justify-content: flex-start;
    align-items: flex-start;
    position: relative;
    text-decoration: none;
    width: 100%;
    box-sizing: border-box;
    text-align: left;
    padding: 16px 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    }


        hr{
            display: none;
        }

        .secret-badge {
            display: inline-block;
            background-color: #ffffff2b;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
            position: absolute;
            right: 16px;
            top: 8px;
            z-index: 10;
        }

        .ccfolia_wrap.light .secret-badge {
            background-color: #0000002b;
            color: #111827;
        }

        /* Light theme overrides */
        .ccfolia_wrap.light {
            background-color: #f9fafb !important;
        }

        .ccfolia_wrap.light .gap {
            border-top-color: rgba(0, 0, 0, 0.1);
        }

        .ccfolia_wrap.light p,
        .ccfolia_wrap.light span {
            color: #575757 !important;
        }

        .ccfolia_wrap.light .msg_container {
            background: transparent !important;
        }

        /* 미리보기의 .preview .player.system 규칙과 짝을 맞춘다.
           이게 없으면 .textWrap의 인라인 float:left가 살아나 시스템 메시지가 왼쪽으로 붙고,
           .Uname 뱃지도 display:block이라 가로로 늘어난다. */
        .ccfolia_wrap .player.system {
            text-align: center;
            justify-content: center;
            width: 100%;
            max-width: none;
            margin: 0;
            border-radius: 0;
            background: transparent !important;
        }

        .ccfolia_wrap .player.system .textWrap {
            float: none !important;
            width: auto;
            max-width: calc(100% - 32px);
            box-sizing: border-box;
            margin: 0 auto !important;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .ccfolia_wrap .player.system .Uname {
            display: table;
            width: auto;
            margin-left: auto !important;
            margin-right: auto !important;
        }

        .ccfolia_wrap .player.system .Utext {
            text-align: center;
        }

        .ccfolia_wrap.light .player.system {
            background: rgb(0 0 0 / 4%) !important;
            border-top-color: rgba(0, 0, 0, 0.1) !important;
        }

        .ccfolia_wrap.light .player.system .Uname {
            background: #0000001c !important;
            color: #5a6671 !important;
        }

        .ccfolia_wrap.light .player.system .Utext {
            color: #4b5563 !important;
        }

        /* 말풍선 테마 / 간략화 규칙. 미리보기에서는 페이지 스타일시트가 이걸 대주는데,
           내보낸 파일에는 .preview가 없어 그대로는 안 먹는다. 여기에 옮겨 놓지 않으면
           잡담(other)·정보(info) 탭의 .bubble-surface가 무스타일로 깨진다. */
        .ccfolia_wrap .gap.other-compact { display: block !important; padding: 4px 16px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ccfolia_wrap .gap.other-compact .compact-name { font-weight: 700; margin-right: 6px; }
        .ccfolia_wrap .gap.other-compact .compact-text { color: #ddd; }
        .ccfolia_wrap.light .gap.other-compact .compact-text { color: #575757; }
        .ccfolia_wrap .gap.info-message.bubble-themed,
        .ccfolia_wrap .gap.other-message.bubble-themed {
            width: 100%;
            margin: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }
        .ccfolia_wrap .gap.info-message.bubble-themed {
            padding: 4px 16px !important;
        }
        .ccfolia_wrap .gap.other-message.bubble-themed {
            margin-top: 0;
            margin-bottom: 0;
            border: 0;
            border-radius: 20px;
            padding: 2px 16px !important;
            background-color: var(--main-card-color) !important;
        }
        .ccfolia_wrap .gap.info-message.bubble-themed .bubble-surface,
        .ccfolia_wrap .gap.other-message.bubble-themed .bubble-surface {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            padding: 8px 12px;
            border-radius: 16px;
            background-color: var(--bubble-color) !important;
        }
        .ccfolia_wrap .gap.info-message.bubble-themed .bubble-surface { border-radius: 12px; }
        .ccfolia_wrap .gap.info-message.bubble-themed .bubble-surface {
            border: 1px solid rgba(255,255,255,.12);
            border-left: 4px solid rgba(255,255,255,.45);
            box-shadow: 0 3px 10px rgba(0,0,0,.12);
        }
        .ccfolia_wrap .gap.other-message.bubble-themed.other-compact .bubble-surface {
            display: block;
            padding: 7px 12px;
            border-radius: 16px;
        }
        .ccfolia_wrap .gap.other-message.other-compact {
            padding: 7px 12px !important;
            border-radius: 0;
        }
        .ccfolia_wrap.light .gap.info-message.bubble-themed,
        .ccfolia_wrap.light .gap.other-message.bubble-themed { border-color: transparent; box-shadow: none; }
        .ccfolia_wrap.light .gap.info-message.bubble-themed .bubble-surface {
            border-color: rgba(0,0,0,.1);
            border-left-color: rgba(0,0,0,.22);
            box-shadow: 0 3px 10px rgba(0,0,0,.06);
        }
      </style>
    </head>
  `;

            const isLightTheme = document.getElementById('lightThemeToggle').checked;
            if (isLightTheme) {
                wrap.classList.add('light');
            }
            const body = `<body>${exportWrapHtml(wrap)}</body>`;
            if (isLightTheme) {
                wrap.classList.remove('light');
            }

            const fullHtml = `${doctype}\n${htmlOpen}\n${head}\n${body}\n${htmlClose}`;

            const blob = new Blob([fullHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const roomIdForName = document.getElementById('roomInput').value.trim();
            const filename = roomIdForName || 'ccfolia-wrap';

            a.download = filename + '.html';
            a.click();
            URL.revokeObjectURL(url);
        });


        // 텍스트 저장
        const saveTxtBtn = document.getElementById('saveTxtBtn');
        saveTxtBtn.addEventListener('click', () => {
            const wrap = previewArea.querySelector('.ccfolia_wrap');
            if (!wrap) {
                alert('.ccfolia_wrap 요소를 찾을 수 없습니다.');
                return;
            }

            const doctype = '<!DOCTYPE html>';
            const htmlOpen = '<html lang="en">';
            const htmlClose = '</html>';
            const head = `
    <head>
      <meta charset="UTF-8">
      <title>ccfolia-wrap Export</title>

        async function loadFirestoreMessages() {
            const roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) return alert('룸 ID를 입력해주세요.');

            const url = `https://firestore.googleapis.com/v1/projects/ccfolia-160aa/databases/(default)/documents/rooms/${roomId}/messages/?pageSize=1000`;

            try {
                const res = await fetch(url);
                const json = await res.json();
                if (!json.documents) {
                    previewArea.innerHTML = '<p style="color:red;">메시지를 불러올 수 없습니다.</p>';
                    return;
                }

                allMessages = json.documents.map(doc => {
                    const f = doc.fields;
                    return {
                        name: f.name?.stringValue ?? "이름 없음",
                        text: f.text?.stringValue ?? "",
                        icon: f.iconUrl?.stringValue ?? "",
                        color: f.color?.stringValue ?? "#ccc",
                        channel: f.channelName?.stringValue ?? "기타"
                    };
                });

                renderChannelFilter();
                renderMessages(); // 전체 표시
            } catch (e) {
                console.error(e);
                previewArea.innerHTML = `<p style="color:red;">에러: ${e.message}</p>`;
            }
        }

        function renderChannelFilter() {
            const channelSet = new Set(allMessages.map(m => m.channel));
            const html = ['<button onclick="renderMessages(null)">전체</button>']
                .concat([...channelSet].map(ch =>
                    `<button onclick="renderMessages('${ch}')">${ch}</button>`))
                .join('');
            const unusedFilterMarkup = html;
        }

        function renderMessages(filterChannel = null) {
            const target = document.createElement('div');
            target.className = 'ccfolia_wrap';

            const filtered = filterChannel
                ? allMessages.filter(m => m.channel === filterChannel)
                : allMessages;

            filtered.forEach(m => {
                const gap = document.createElement('div');
                gap.className = 'gap';
                gap.dataset.channel = m.channel;

                const iconHTML = m.icon
                    ? `<div class="msg_container"><img src="${m.icon}" alt="icon"></div>`
                    : '';

                const messageHTML = `
      ${iconHTML}
      <div>
        <span style="color:${m.color}; font-weight:bold;">${m.name}</span><br/>
        <span>${m.text}</span>
      </div>
    `;
                gap.innerHTML = messageHTML;

                const hr = document.createElement('hr');
                // 명시적 스타일 지정
                hr.style.margin = '0px';
                hr.style.padding = '0px';
                hr.style.borderWidth = '1px 0px 0px';
                hr.style.flexShrink = '0';
                hr.style.borderTopStyle = 'solid';
                hr.style.borderTopColor = 'rgba(255, 255, 255, 0.08)';
                hr.style.display = 'block';
                target.appendChild(hr);
                target.appendChild(gap);
            });

            previewArea.innerHTML = '';
            previewArea.appendChild(target);
            applyStyleToPreviewArea();

        }


        window.allMessages = [];
        window.selectedChannels = new Set();

        async function loadFirestoreMessages() {
            const rawInput = document.getElementById('roomInput').value.trim();
            const roomId = extractRoomId(rawInput);
            if (!roomId) return alert('룸 ID를 입력해주세요.');

            const baseUrl = `https://firestore.googleapis.com/v1/projects/ccfolia-160aa/databases/(default)/documents/rooms/${roomId}/messages`;

            let allDocs = [];
            let pageToken = null;
            let page = 1;

            // 진행 상황 표시 영역
            previewArea.innerHTML = '<p style="color:#888;padding:20px;">메시지를 불러오는 중...</p>';

            try {
                while (true) {
                    const url = new URL(baseUrl);
                    url.searchParams.set('pageSize', '1000');
                    if (pageToken) {
                        url.searchParams.set('pageToken', pageToken);
                    }

                    const res = await fetch(url.toString());
                    const json = await res.json();

                    if (json.documents) {
                        allDocs = allDocs.concat(json.documents);
                        // 진행 상황 업데이트
                        previewArea.innerHTML = `<p style="color:#888;padding:20px;">페이지 ${page} 로딩 중... (${allDocs.length}개 메시지)</p>`;
                    }

                    if (!json.nextPageToken) break;
                    pageToken = json.nextPageToken;
                }

                if (allDocs.length === 0) {
                    previewArea.innerHTML = '<p style="color:red;">메시지를 불러올 수 없습니다.</p>';
                    return;
                }

                const sorted = allDocs.sort((a, b) => {
                    const aTime = a.fields.createdAt?.timestampValue || '';
                    const bTime = b.fields.createdAt?.timestampValue || '';
                    return new Date(aTime) - new Date(bTime); // 오래된 → 최신
                });

                window.allMessages = sorted.map(doc => {
                    const f = doc.fields;

                    // 주사위 결과 추출 시도
                    let rollResult = "";
                    try {
                        rollResult = f.extend?.mapValue?.fields?.roll?.mapValue?.fields?.result?.stringValue || "";
                    } catch (e) {
                        rollResult = "";
                    }

                    // 채널명 정규화: "メイン"을 "메인"으로 통일
                    let channelName = f.channelName?.stringValue ?? "기타";
                    if (channelName === "メイン") {
                        channelName = "메인";
                    }

                    // 포트레이트 우선순위: extend.portrait.url > iconUrl
                    let iconUrl = "";
                    try {
                        iconUrl = f.extend?.mapValue?.fields?.portrait?.mapValue?.fields?.url?.stringValue
                            || f.iconUrl?.stringValue
                            || "";
                    } catch (e) {
                        iconUrl = f.iconUrl?.stringValue ?? "";
                    }

                    return {
                        name: f.name?.stringValue ?? "이름 없음",
                        text: f.text?.stringValue + (rollResult ? ` > ${rollResult}` : "") ?? "",
                        icon: iconUrl,
                        color: f.color?.stringValue ?? "#ccc",
                        channel: channelName
                    };
                });

                // 초기 로딩 시 메인 채널만 선택
                window.selectedChannels = new Set(["메인"]);
                renderChannelFilter();
                createChannelColorSettings();
                renderMessages();

            } catch (e) {
                console.error(e);
                previewArea.innerHTML = `<p style="color:red;">에러 발생: ${e.message}</p>`;
            }
        }

        function renderChannelFilter() {
            const channelSet = new Set(window.allMessages.map(m => m.channel));
            const filterDiv = document.createElement('div');
            filterDiv.innerHTML = '';

            // 전체 버튼
            const allBtn = document.createElement('button');
            allBtn.textContent = '전체';
            allBtn.onclick = () => toggleAllChannels();
            if (window.selectedChannels.size === 0) {
                allBtn.classList.add('active');
            }
            filterDiv.appendChild(allBtn);

            // 각 채널 버튼
            [...channelSet].forEach(ch => {
                const btn = document.createElement('button');
                btn.textContent = ch;
                btn.onclick = () => toggleChannel(ch);
                if (window.selectedChannels.has(ch)) {
                    btn.classList.add('active');
                }
                filterDiv.appendChild(btn);
            });
        }

        function toggleAllChannels() {
            if (window.selectedChannels.size === 0) {
                // 이미 전체가 선택되어 있으면 아무것도 안함
                return;
            }
            window.selectedChannels.clear();
            renderChannelFilter();
            renderMessages();
        }

        function toggleChannel(channel) {
            if (window.selectedChannels.has(channel)) {
                window.selectedChannels.delete(channel);
            } else {
                window.selectedChannels.add(channel);
            }
            renderChannelFilter();
            renderMessages();
        }

        function renderMessages() {
            const target = document.createElement('div');
            target.className = 'ccfolia_wrap';
            blankRowTemplates.clear(); // 패딩·폰트 설정이 바뀌면 껍데기도 새로 떠야 한다

            // 줄을 바로 wrap에 붙이지 않고 200개씩 묶는다 (updateChunkVisibility 참고)
            let chunk = null, chunkFill = 0;
            const addRow = row => {
                if (!chunk || chunkFill === VCHUNK_SIZE) {
                    chunk = document.createElement('div');
                    chunk.className = 'vchunk';
                    target.appendChild(chunk);
                    chunkFill = 0;
                }
                chunk.appendChild(row);
                chunkFill++;
            };

            // 초상화는 메시지마다 <img src="data:..."> 로 박으면 같은 base64가 수천 번 복제된다.
            // 이미지당 한 번만 .avatar-image-N 규칙으로 찍고, 칸에는 클래스만 붙인다.
            // (클래스 이름은 collectAvatarImages가 이미 읽는 형식이라 재불러오기도 그대로 먹는다)
            const iconIndex = new Map();
            const iconRules = [];
            const iconClass = url => {
                if (!iconIndex.has(url)) {
                    iconIndex.set(url, iconIndex.size);
                    // 라이트 테마의 .ccfolia_wrap.light .msg_container{background:transparent!important}가
                    // 단축 속성이라, !important + 더 높은 명시도(0,3,0)가 아니면 초상화가 통째로 지워진다.
                    iconRules.push(`.ccfolia_wrap .msg_container.avatar-image-${iconIndex.get(url)}{background-image:url("${cssUrl(url)}")!important;background-size:cover!important;background-position:top center!important}`);
                }
                return `avatar-image-${iconIndex.get(url)}`;
            };

            // 본문에 삽입된 이미지도 같은 방식으로 규칙 한 줄씩만 깐다.
            const usedInserted = new Set();
            const insertedRule = id => {
                const info = insertedImages.get(id);
                return info ? `.ccfolia_wrap .insimg-${id}{width:${info.w}px;aspect-ratio:${info.w}/${info.h};background-image:url("${cssUrl(info.src)}")}` : '';
            };

            // 인라인 style도 메시지 수만큼 복제된다. 같은 선언은 클래스 하나로 묶는다.
            // 명시도: 라이트 테마가 .ccfolia_wrap.light span{...!important}(0,2,1)로 덮으므로
            // 최소 (0,3,0)이 되도록 선택자를 세 벌 깔아 준다.
            const styleIndex = new Map();
            const styleRules = [];
            const styleClass = css => {
                const key = css.replace(/\s+/g, ' ').trim();
                if (!styleIndex.has(key)) {
                    const n = styleIndex.size;
                    styleIndex.set(key, n);
                    styleRules.push(`.ccfolia_wrap .gap.s${n},.ccfolia_wrap .gap .s${n},.ccfolia_wrap .player.system.s${n},.ccfolia_wrap .player.system .s${n}{${key}}`);
                }
                return 's' + styleIndex.get(key);
            };

            // system 메시지 안쪽 상자는 내용이 고정이라 한 벌만 있으면 된다.
            // 글자 크기만 설정값을 따른다 (기본 16px일 때의 13/15px 비율 유지).
            const systemInnerRule = () => [
                '.ccfolia_wrap .player.system .infoWrap{display:none}',
                '.ccfolia_wrap .player.system .imgWrap{width:40px;height:40px;overflow:hidden;background-color:rgba(0,0,0,0.31);float:left;border-radius:5px}',
                '.ccfolia_wrap .player.system .textWrap{float:left;line-height:1.6;margin-left:0;color:#FFFFFF;padding:10px 20px}',
                `.ccfolia_wrap .player.system .Uname{margin:0 0 6px 0;font-weight:800;color:#858296;font-size:${parseInt(fontSizeValue) - 3}px;letter-spacing:1px;padding:3px 8px;border-radius:15px;background:#000000}`,
                `.ccfolia_wrap .player.system .Utext{margin:0;font-weight:400;color:#908e9a;font-size:${parseInt(fontSizeValue) - 1}px;letter-spacing:-1px}`
            ].join('\n');
            let hasSystem = false;

            // 선택된 채널이 없으면 전체 표시
            const filtered = window.selectedChannels.size === 0
                ? window.allMessages
                : window.allMessages.filter(m => window.selectedChannels.has(m.channel));

            const narratorName = document.getElementById('narratorInput')?.value?.trim();
            const removeItalic = document.getElementById('removeNarratorItalicCheckbox')?.checked;
            const paddingValue = paddingInput.value || "16";
            const fontSizeValue = fontSizeInput.value || "16";

            // 메인 컨테이너 배경색 설정 (첫 번째 메시지의 채널 색상 사용)
            if (filtered.length > 0) {
                const firstChannel = filtered[0].channel;
                const mainColor = getChannelColor(firstChannel);
                target.style.backgroundColor = bubbleThemeEnabled ? getMainChannelColor() : mainColor;
            }

            filtered.forEach(m => {
                // 동적 채널별 배경색 가져오기
                const channelBackgroundColor = getChannelColor(m.channel);

                // SYSTEM 메시지 처리
                if (m.name.toLowerCase() === 'system') {
                    hasSystem = true;
                    const systemDiv = document.createElement('div');
                    systemDiv.className = 'player system ' + styleClass(`display:flex;overflow:hidden;padding:0px;border-top:1px solid rgba(255,255,255,0.08);background:${channelBackgroundColor};text-align:center;justify-content:center`);
                    systemDiv.dataset.channel = m.channel;
                    // 안쪽 상자들은 메시지마다 똑같으므로 systemInnerRule 한 벌로 뺀다.
                    systemDiv.innerHTML = `<div class="infoWrap"><div class="imgWrap"></div></div><div class="textWrap"><p class="Uname">system</p><p class="Utext">${m.text}</p></div>`;
                    systemDiv.__msg = m;
                    addRow(systemDiv);
                    return;
                }

                const gap = document.createElement('div');
                gap.className = 'gap';
                gap.dataset.channel = m.channel;

                // info/other는 서술자 설정을 사용하지 않는다. 포트레이트는 옵션으로 허용한다.
                const plainChannel = isBubbleTab(m.channel);
                const isOther = isOtherTab(m.channel);
                const cardBackgroundColor = plainChannel && bubbleThemeEnabled ? getMainChannelColor() : channelBackgroundColor;
                const bubbleColor = plainChannel && bubbleThemeEnabled ? channelBackgroundColor : cardBackgroundColor;
                // 커스텀 속성도 같은 클래스에 얹는다 (cssText 대입이 인라인 변수를 날리는 문제도 같이 사라진다)
                if (plainChannel) {
                    gap.classList.add(styleClass(`--main-card-color:${cardBackgroundColor};--bubble-color:${bubbleColor}`));
                    if (bubbleThemeEnabled) gap.classList.add('bubble-themed');
                }
                if (isInfoTab(m.channel)) gap.classList.add('info-message');
                else if (isOther) gap.classList.add('other-message');
                const isCompactOther = isOther && tabSettings.get(m.channel)?.compact;
                const isNarrator = !!narratorName && m.name === narratorName && isMainTab(m.channel);
                const useBubbleSurface = plainChannel && bubbleThemeEnabled;
                const bubbleSurface = useBubbleSurface ? document.createElement('div') : gap;
                if (useBubbleSurface) bubbleSurface.className = 'bubble-surface';

                if (isCompactOther) {
                    gap.classList.add('other-compact');
                    const fontRule = styleClass(`font-size:${fontSizeValue}px`);
                    const name = document.createElement('span'); name.className = `nm compact-name ${fontRule} ` + styleClass(`color:${m.color || '#ccc'}!important`); name.textContent = m.name;
                    const text = document.createElement('span'); text.className = 'compact-text ' + fontRule; text.textContent = `: ${m.text}`;
                    bubbleSurface.append(name, text);
                    if (useBubbleSurface) gap.appendChild(bubbleSurface);
                    addRow(gap); return;
                }

                if (isNarrator) {
                    // 서술자 스타일
                    const fontStyleValue = removeItalic ? 'normal' : 'italic';
                    gap.classList.add(styleClass(`display:flow-root;background-color:${channelBackgroundColor};position:relative;padding:2px 16px;text-align:center`));

                    const p = document.createElement('p');
                    p.className = styleClass(`color:rgb(221,221,221);display:flow-root;width:100%;font-style:${fontStyleValue};font-weight:bold;text-align:center;margin:7px!important`);

                    const spanText = document.createElement('span');
                    if (m.html) spanText.innerHTML = m.html;
                    else spanText.innerHTML = m.text.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/\n/g, '<br>');
                    spanText.className = 'tx ' + styleClass(`font-size:${fontSizeValue}px`);
                    spanText.querySelectorAll('.insimg').forEach(el => {
                        const cls = [...el.classList].find(c => /^insimg-\d+$/.test(c));
                        if (cls) usedInserted.add(Number(cls.slice(7)));
                    });
                    attachImagePaste(spanText, m);
                    p.appendChild(spanText);
                    gap.appendChild(p);
                } else {
                    // 일반 메시지 스타일
                    gap.classList.add(styleClass(`display:flex;background-color:${cardBackgroundColor};position:relative;padding:${paddingValue}px 16px`));

                    if (m.imageOnly) gap.classList.add('image-row');
                    if (!isCompactOther && !m.imageOnly && tabSettings.get(m.channel)?.portrait !== false) {
                        const msgContainer = document.createElement('div');
                        msgContainer.className = 'msg_container';
                        if (m.icon) {
                            msgContainer.classList.add(iconClass(m.icon));
                            msgContainer.setAttribute('aria-hidden', 'true'); // 이름이 바로 옆에 있는 장식 이미지
                        }
                        bubbleSurface.appendChild(msgContainer);
                    }

                    const p = document.createElement('p');
                    p.className = styleClass('color:rgb(221,221,221)');

                    const spanName = document.createElement('span');
                    spanName.textContent = m.name;
                    // 라이트 테마의 .light span { color !important }를 이기려면 규칙 쪽도 !important + 높은 명시도
                    spanName.className = 'nm ' + styleClass(`color:${m.color}!important;font-weight:bold;font-size:${fontSizeValue}px`);
                    attachNameEdit(spanName, m);

                    const spanBr = document.createElement('br');

                    const spanText = document.createElement('span');
                    // m.html은 sanitizeBodyHtml을 통과한 것만 들어온다 (삽입 이미지가 있는 메시지뿐)
                    if (m.html) spanText.innerHTML = m.html;
                    else spanText.innerHTML = m.text.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/\n/g, '<br>');
                    spanText.className = 'tx ' + styleClass(`font-size:${fontSizeValue}px`);
                    spanText.querySelectorAll('.insimg').forEach(el => {
                        const cls = [...el.classList].find(c => /^insimg-\d+$/.test(c));
                        if (cls) usedInserted.add(Number(cls.slice(7)));
                    });
                    attachImagePaste(spanText, m);

                    if (!m.imageOnly) { p.appendChild(spanName); p.appendChild(spanBr); }
                    p.appendChild(spanText);
                    bubbleSurface.appendChild(p);

                    // 비밀 채널 메시지에 (비밀) 뱃지 추가
                    // 더 유연한 채널명 매칭 (공백 제거, 대소문자 무시)
                    const normalizedChannel = m.channel.replace(/\s+/g, '').toLowerCase();
                    if (normalizedChannel === '비밀' || normalizedChannel === 'secret' || m.channel.includes('비밀')) {
                        const secretBadge = document.createElement('span');
                        secretBadge.className = 'secret-badge';
                        secretBadge.textContent = '귓속말';
                        secretBadge.classList.add(styleClass(`font-size:${parseInt(fontSizeValue) - 3}px`));
                        bubbleSurface.appendChild(secretBadge);
                    }
                    // 채널 뱃지는 출력 탭 설정 팝업에서만 관리
                    if (tabSettings.get(m.channel)?.badge) {
                        const channelBadge = document.createElement('span');
                        channelBadge.className = 'secret-badge';
                        channelBadge.textContent = m.channel;
                        channelBadge.classList.add(styleClass(`font-size:${parseInt(fontSizeValue) - 3}px`));
                        bubbleSurface.appendChild(channelBadge);
                    }
                    if (useBubbleSurface) gap.appendChild(bubbleSurface);
                }

                gap.__msg = m;
                if (!isNarrator && !blankRowTemplates.has(m.channel)) blankRowTemplates.set(m.channel, blankRowTemplate(gap));
                addRow(gap);
            });

            // wrap 안에 넣어야 outerHTML 내보내기에 규칙이 같이 딸려 나간다.
            const allRules = [...styleRules, ...iconRules];
            if (usedInserted.size) allRules.push(INSERTED_BASE_RULE, ...[...usedInserted].map(insertedRule).filter(Boolean));
            if (filtered.some(m => m.imageOnly)) allRules.push(IMAGE_ROW_RULE);
            if (hasSystem) allRules.push(systemInnerRule());
            if (allRules.length) {
                const st = document.createElement('style');
                st.textContent = allRules.join('\n');
                target.prepend(st);
            }

            previewArea.innerHTML = '';
            previewArea.appendChild(target);
            applyPreviewTabVisibility();

            // 편집 기능 추가
            wireEditing(previewArea);
            updateChunkVisibility();
        }

        // ✱ 서술자 지정 기능
        // ✱ 서술자 지정 기능 (텍스트 유지)
        function applyNarratorMode(name) {
            const removeItalic = document.getElementById('removeNarratorItalicCheckbox')?.checked;
            const fontStyleValue = removeItalic ? 'normal' : 'italic';

            const divs = document.querySelectorAll('.gap');
            divs.forEach(div => {
                const nameSpan = div.querySelector('p span:nth-child(2)');
                const textSpan = div.querySelector('p span:last-child');
                if (nameSpan && nameSpan.textContent.trim() === name && isMainTab(div.dataset.channel)) {
                    const originalText = textSpan ? textSpan.innerHTML : "";

                    div.innerHTML = `
        <p style="color: rgb(221, 221, 221); display: flow-root; font-style: ${fontStyleValue}; font-weight: bold; text-align: center; margin: 8px;">
          <span></span> <span style="color: rgb(136, 136, 136);"></span><span></span><span>${originalText}</span>
        </p>
      `;
                    div.style.display = 'flow-root';
                    div.style.backgroundColor = 'transparent';
                    div.style.padding = '2px 16px';
                }
            });
        }


        // 채널별 색상 설정 생성
        function createChannelColorSettings() {
            const channelSet = new Set(window.allMessages.map(m => m.channel));
            const container = document.getElementById('channelColorSettings');
            container.innerHTML = '';
            channelColors = {};

            // 기본 색상 설정
            const defaultColors = {
                '메인': '#1f1e22',
                '비밀': '#3d3d3d',
                '사담': '#3d3d3d',
                '기타': '#3d3d3d',
                'info': '#3d3d3d',
                '정보': '#3d3d3d'
            };

            channelSet.forEach(channel => {
                // 채널명에 특정 키워드가 포함된 경우 해당 색상 적용
                let colorKey = '기타'; // 기본값
                if (isMainTab(channel)) {
                    colorKey = '메인';
                } else if (channel.includes('비밀')) {
                    colorKey = '비밀';
                    // 비밀은 귓속말 뱃지 자동 표시, 체크박스 불필요
                } else if (isOtherTab(channel)) {
                    colorKey = '사담';
                } else if (isInfoTab(channel)) {
                    colorKey = 'info';
                }

                const label = document.createElement('label');
                label.style.cssText = 'flex-direction: row; align-items: center; gap: 6px;';
                label.dataset.channel = channel;

                const baseColor = lightThemeToggle.checked
                    ? ((isMainTab(channel)) ? '#f1f1f1' : '#E3E3E3')
                    : (defaultColors[colorKey] || '#3d3d3d');
                const isBubbleChannel = isBubbleTab(channel);
                const bubbleBaseColor = lightThemeToggle.checked ? '#f1f1f1' : '#1f1e22';
                const defaultColor = isBubbleChannel && bubbleThemeEnabled
                    ? mixHex(bubbleBaseColor, lightThemeToggle.checked ? '#000000' : '#ffffff', 0.07)
                    : baseColor;

                label.innerHTML = `
                    ${channel}:
                    <input type="color" id="channelColor_${channel}" value="${defaultColor}" />
                `;
                label.querySelector('input[type="color"]').dataset.channel = channel;
                container.appendChild(label);
            });

            // 저장된 채널 설정 복원 후, 변경 시 자동 저장 리스너 등록
            restoreChannelSettings();
            if (lightThemeToggle.checked) {
                channelSet.forEach(channel => {
                    const colorInput = [...container.querySelectorAll('input[type="color"]')].find(x => x.dataset.channel === channel);
                    if (!colorInput) return;
                    colorInput.value = isBubbleTab(channel)
                        ? mixHex('#f1f1f1', '#000000', 0.07)
                        : (isMainTab(channel) ? '#f1f1f1' : '#E3E3E3');
                });
            }
            channelSet.forEach(channel => {
                const colorInput = [...container.querySelectorAll('input[type="color"]')].find(x => x.dataset.channel === channel);
                if (colorInput) {
                    channelColors[channel] = colorInput.value;
                    colorInput.addEventListener('input', () => {
                        channelColors[channel] = colorInput.value;
                        if (isBubbleTab(channel)) bubbleCustomColors.add(channel);
                        else if (isMainTab(channel) && bubbleThemeEnabled) applyBubbleDefaultColors();
                        renderMessages();
                    });
                }
                document.getElementById(`channelColor_${channel}`)?.addEventListener('change', saveChannelSettings);
            });
            syncStyleChannelVisibility();
        }

        // Firestore 메시지 불러오기 시 주소에서 ID 추출
        function extractRoomId(input) {
            const match = input.match(/rooms\/([\w-]+)/);
            return match ? match[1] : input.trim();
        }

        // ─── 설정 저장/불러오기 (localStorage) ───────────────────────────
        const SETTINGS_KEY = 'ccfolia_settings';
        const CHANNEL_SETTINGS_KEY = 'ccfolia_channel_settings';

        function saveSettings() {
            const s = {
                narratorName: document.getElementById('narratorInput')?.value ?? '',
                removeItalic: document.getElementById('removeNarratorItalicCheckbox')?.checked ?? false,
                padding: document.getElementById('paddingInput')?.value ?? '16',
                fontSize: document.getElementById('fontSizeInput')?.value ?? '16',
                lightTheme: document.getElementById('lightThemeToggle')?.checked ?? false,
                bubbleTheme: document.getElementById('bubbleThemeToggle')?.checked ?? true,
            };
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
        }

        function loadSettings() {
            const raw = localStorage.getItem(SETTINGS_KEY);
            if (!raw) return;
            try {
                const s = JSON.parse(raw);
                if (s.narratorName != null) document.getElementById('narratorInput').value = s.narratorName;
                document.getElementById('removeNarratorItalicCheckbox').checked = s.removeItalic ?? false;
                if (s.padding != null) document.getElementById('paddingInput').value = s.padding;
                if (s.fontSize != null) document.getElementById('fontSizeInput').value = s.fontSize;
                const lightToggle = document.getElementById('lightThemeToggle');
                lightToggle.checked = s.lightTheme ?? false;
                bubbleThemeToggle.checked = s.bubbleTheme ?? true;
                bubbleThemeEnabled = bubbleThemeToggle.checked;
                if (lightToggle.checked) previewArea.classList.add('light');
            } catch (e) {
                console.warn('설정 불러오기 실패:', e);
            }
        }

        function saveChannelSettings() {
            const channelSet = new Set(window.allMessages.map(m => m.channel));
            const s = {};
            channelSet.forEach(channel => {
                s[channel] = {
                    color: document.getElementById(`channelColor_${channel}`)?.value,
                };
            });
            localStorage.setItem(CHANNEL_SETTINGS_KEY, JSON.stringify(s));
        }

        function restoreChannelSettings() {
            const raw = localStorage.getItem(CHANNEL_SETTINGS_KEY);
            if (!raw) return;
            try {
                const s = JSON.parse(raw);
                Object.entries(s).forEach(([channel, cs]) => {
                    const colorEl = document.getElementById(`channelColor_${channel}`);
                    if (colorEl && cs.color) colorEl.value = cs.color;
                });
            } catch (e) {
                console.warn('채널 설정 불러오기 실패:', e);
            }
        }

        // 정적 입력 자동 저장
        ['narratorInput', 'paddingInput', 'fontSizeInput'].forEach(id => {
            document.getElementById(id)?.addEventListener('input', saveSettings);
        });
        ['removeNarratorItalicCheckbox', 'lightThemeToggle'].forEach(id => {
            document.getElementById(id)?.addEventListener('change', saveSettings);
        });

        loadSettings();

        // ─── HTML 업로드 → 파싱 (확장 뷰어 출력 형식) ───────────────
        // 편집 완료 표식 제거
        const stripEdited = (s) => (s || '').replace(/(\s*\[편집\s*완료\])+\s*$/, '').trim();

        function parseViewerHTML(htmlString) {
            const doc = new DOMParser().parseFromString(htmlString, 'text/html');
            // 신규 경량 구조(.m) 우선, 없으면 레거시(.MUI [data-index]) 폴백
            const compact = doc.querySelectorAll('.m');
            const msgs = [];

            if (compact.length) {
                compact.forEach(x => {
                    const nm = x.querySelector('.nm');
                    let name = '', color = '';
                    if (nm) {
                        for (const n of nm.childNodes) if (n.nodeType === 3) name += n.textContent;
                        name = name.trim();
                        color = nm.style.color || '';
                    }
                    const tx = x.querySelector('.tx');
                    let text = '';
                    if (tx) {
                        const clone = tx.cloneNode(true);
                        clone.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
                        text = stripEdited(clone.textContent);
                    }
                    const img = x.querySelector('img.av') || x.querySelector('img');
                    const icon = img ? (img.getAttribute('src') || '') : '';
                    if (x.classList.contains('sys') || name.toLowerCase() === 'system') {
                        if (text === '') return;
